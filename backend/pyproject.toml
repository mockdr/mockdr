[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mockdr"
version = "2.7.0"
description = "Full-fidelity multi-EDR mock server (SentinelOne, CrowdStrike, MDE, Elastic Security, Cortex XDR, Splunk) for SOAR/SIEM integration testing"
requires-python = ">=3.11"
license = "LicenseRef-BSL-1.1"
authors = [
    {name = "Guenter Weber", email = "contact@mockdr.io"},
]
keywords = ["sentinelone", "crowdstrike", "microsoft-defender", "elastic-security", "cortex-xdr", "splunk", "mock", "api", "security", "edr", "soar", "siem", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
]
# The README sits beside backend/, where a build may not read it (setuptools
# refuses a file outside the project directory), so the long description
# points at it.
readme = {text = "Full-fidelity multi-EDR/SIEM mock server. See https://github.com/mockdr/mockdr#readme.", content-type = "text/markdown"}
dependencies = [
    # Pinned to what requirements.txt pins and the conformance harness measured:
    # FastAPI accepts a Starlette range, and Starlette 1.8 sends `Vary: Origin`
    # on every answer, which neither splunkd nor Elasticsearch does.
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "faker>=18.0",
    "python-multipart>=0.0.5",
    "aiofiles>=23.0",
    "httpx>=0.24",
    # Signs the Microsoft mounts' JWT access tokens (utils/entra_access_token.py).
    "cryptography==50.0.2",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/mockdr/mockdr"
Repository = "https://github.com/mockdr/mockdr"
Issues = "https://github.com/mockdr/mockdr/issues"

[project.scripts]
mockdr = "main:_cli"

# ── Packaging ──────────────────────────────────────────────────────────────────
# The backend is a flat layout of several top-level packages plus `main` and
# `config`, and `mockdr.testing` starts the whole app ("main:app"), so an
# install carries all of it, with the JSON fixtures the routes answer from.
# The three vendor references the app reads at run time live in
# ../data/vendor-specs; setup.py copies them in (see utils/vendor_specs.py).

[tool.setuptools]
py-modules = ["main", "config"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*", "application*", "domain*", "infrastructure*", "mockdr*",
    "repository*", "utils*",
]

[tool.setuptools.package-data]
"infrastructure" = ["fixtures/*.json", "fixtures/*/*.json"]
"utils" = ["_vendor_specs/*.json"]

# ── Pytest ─────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-n", "auto",
    "--dist", "loadfile",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning:jsonschema",
]
markers = [
    "critical: critical-path tests (coverage gate 95%)",
    "unit: pure unit tests with no I/O",
    "integration: tests involving multiple layers",
]

# ── Coverage ───────────────────────────────────────────────────────────────────

[tool.coverage.run]
# sys.monitoring rather than settrace, as CI already asks through
# COVERAGE_CORE: the same numbers, and the full suite at -n 8 in 172 s
# instead of 272 s here. Pythons before 3.12 fall back to the default core.
core = "sysmon"
source = ["."]
omit = ["tests/*", "infrastructure/seed*", ".venv/*", "main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ── Mypy ───────────────────────────────────────────────────────────────────────

[tool.mypy]
strict = true
disallow_any_generics = false
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["tests/", ".venv/", "infrastructure/seed.py"]

[[tool.mypy.overrides]]
# seed.py is a data-generation script, not production code — skip strict checks
module = "infrastructure.seed"
ignore_errors = true

# ── Ruff ───────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
exclude = [".venv", "__pycache__", "infrastructure/seed.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
]
ignore = [
    "D100",  # missing docstring in public module (handled at function/class level)
    "D104",  # missing docstring in public package
    # Mock server uses hardcoded credentials and passwords by design
    "S105",  # hardcoded-password-string
    "S106",  # hardcoded-password-func-arg
    "S107",  # hardcoded-password-default
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Domain dataclass fields + DTO fields mirror real SentinelOne API camelCase naming.
# N815 (mixedCase variable in class scope) is intentional throughout.
"domain/**" = ["N815"]
"api/dto/**" = ["N815"]
# Router query-param names mirror real S1 API params — N803 (argument lowercase) and
# B008 (function call in default argument) are intentional FastAPI patterns
# S110: Splunk routers use bare except-pass for lenient form-body parsing
"api/routers/**" = ["N803", "B008", "S110"]
"api/auth.py" = ["N803", "B008"]
"api/cs_auth.py" = ["B008"]
"api/es_auth.py" = ["B008"]
"api/mde_auth.py" = ["B008"]
"api/splunk_auth.py" = ["B008", "S110"]
"api/xdr_auth.py" = ["B008"]
# store and utils use Any intentionally for generic record handling
"repository/store.py" = ["ANN401"]
# import_state keys heterogeneous domain objects.
"application/dev/commands.py" = ["ANN401"]
"utils/filtering.py" = ["ANN401"]
"utils/pagination.py" = ["ANN401"]
"utils/cs_fql.py" = ["ANN401"]
"utils/xdr_filters.py" = ["ANN401"]
"utils/xdr_filter_data.py" = ["ANN401"]
"utils/es_query.py" = ["ANN401"]
# A stored field value may be any JSON type; date parsing has to see it raw.
"utils/es_datemath.py" = ["ANN401"]
# A Splunk result value is genuinely any JSON type; CSV renders it raw.
"utils/splunk/csv_output.py" = ["ANN401"]
"utils/es_aggs.py" = ["ANN401"]
"utils/es_ecs.py" = ["ANN401"]
"utils/mde_odata.py" = ["ANN401"]
# KQL and hunting rows are genuinely dynamic — a column may hold any type.
"utils/mde_kql.py" = ["ANN401"]
"application/mde_advanced_hunting/queries.py" = ["ANN401"]
# An eval argument is genuinely any SPL value.
"utils/splunk/spl_functions.py" = ["ANN401"]
# A script assigns any JSON value to a field.
"utils/es_painless.py" = ["ANN401"]
# A document field is genuinely any JSON value; its type is what is inferred.
"utils/es_mapping.py" = ["ANN401"]
# SPL values are genuinely dynamic — a field may hold a string, number or list.
"utils/splunk/spl_expr.py" = ["ANN401"]
"utils/splunk/spl_exec.py" = ["ANN401"]
"utils/splunk/kvstore_query.py" = ["ANN401"]
"mockdr/testing.py" = ["ANN401"]
# ASGI middleware — boilerplate patterns and non-crypto random for jitter/fault injection
"api/middleware/**" = ["D107", "D102", "S311"]
# Seed data uses random, hardcoded paths, and assertions for mock data generation
"infrastructure/seeders/**" = ["E501", "S311", "S108", "S101"]
# Data generators use non-crypto random for mock data
"infrastructure/dv_gen.py" = ["S311"]
"infrastructure/process_gen.py" = ["S311"]
# Application code uses non-crypto random for mock data and hardcoded paths
"application/dev/**" = ["S311"]
"application/agents/commands.py" = ["S108"]
# test files may have long assertion lines
# test files use assert and hardcoded paths for mock data
"tests/**" = ["D", "ANN", "E501", "N802", "S101", "S108"]
# S314: the Splunk XML the mock itself just produced is not untrusted input.
"tests/integration/api/splunk/test_splunk_output_mode.py" = [
    "D", "ANN", "E501", "N802", "S101", "S108", "S314",
]
"tests/integration/api/splunk/test_splunklib_atom.py" = [
    "D", "ANN", "E501", "N802", "S101", "S108", "S314",
]
"tests/integration/api/splunk/test_splunklib_input_kinds.py" = [
    "D", "ANN", "E501", "N802", "S101", "S108", "S314",
]
# Dev CLI binds 0.0.0.0 intentionally
"main.py" = ["S104"]
