services:
  - type: web
    name: mockdr
    env: docker
    repo: https://github.com/mockdr/mockdr
    plan: free
    healthCheckPath: /web/api/v2.1/system/status
    envVars:
      # Anyone on the internet can reach this demo, and the admin token is a
      # documented constant, so "admin only" gates nothing here. Public mode
      # refuses the control routes whose effect leaves the mock or outlives a
      # visitor (recording proxy, outbound webhooks, state import, rate-limit
      # and fault-injection switches) and makes no outbound request at all.
      # See SECURITY.md#running-a-shared-or-public-instance.
      - key: MOCKDR_PUBLIC
        value: "true"
      - key: SEED_COUNT_AGENTS
        value: "60"
      - key: SEED_COUNT_THREATS
        value: "30"
      - key: SEED_COUNT_ALERTS
        value: "20"
      # Seed data is dated from the moment it was seeded; a demo that stays
      # up for days would show an empty "last 24 hours" after one. Re-seeding
      # twice a day keeps every 24-hour window populated. See README, "A
      # long-running instance".
      - key: MOCKDR_RESEED_INTERVAL
        value: "12h"
