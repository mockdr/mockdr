name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-quality:
    name: Backend — lint / type-check / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy --strict --allow-any-generics . --ignore-missing-imports --exclude tests/

      - name: Test + coverage (85% gate)
        run: pytest --cov --cov-fail-under=85

      - name: Critical-path tests (must all pass)
        run: pytest -m critical --no-cov

      - name: Security audit (pip-audit)
        run: pip-audit

      - name: SAST (bandit)
        run: bandit -r . -x ./tests,./.venv -ll

      # The reducers and probes are the fidelity tooling; they were the only
      # Python in the repository nothing linted.
      - name: Lint the scripts (ruff)
        run: ruff check ../scripts

      - name: License compliance (pip-licenses)
        # Exclude own package — BSL 1.1, not in deny-list scope
        run: |
          pip-licenses --format=plain --with-license-file --no-license-path --ignore-packages mockdr
          pip-licenses --fail-on="GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later" --ignore-packages mockdr

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-quality:
    name: Frontend — lint / type-check / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env from example
        run: cp .env.example .env

      - name: Lint (eslint — zero warnings)
        run: npx eslint src/ --max-warnings=0

      - name: Type-check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Unit tests + coverage
        run: npx vitest run --coverage

      - name: Security audit (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: License compliance (license-checker)
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0;GPL-2.0"

  # ── E2E ──────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright critical flows
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install Node dependencies
        run: npm ci
        working-directory: frontend

      - name: Create frontend .env from example
        run: cp .env.example .env
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  # ── Field Drift ─────────────────────────────────────────────────────────────
  hostile-inputs:
    name: Hostile inputs — parser fuzzing and hostile-body probing
    runs-on: ubuntu-latest
    needs: [backend-quality]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # Both found their bugs after a release until 2.0.5 made them a release
      # step; as a job they find them before the merge.
      - name: Fuzz the hand-written parsers
        run: python scripts/fuzz_parsers.py

      - name: Hostile bodies and parameters on every route
        run: python scripts/hostile_probe.py

  # ── Audits ──────────────────────────────────────────────────────────────────
  audits:
    name: Audits — the ones that need nothing but the mock
    runs-on: ubuntu-latest
    needs: [backend-quality]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # These have been release tools run by hand, and "by hand" is how a
      # regression reaches main. The ones needing a real product stay in the
      # conformance workflow; every one of these reads the mock alone and
      # fails on what it finds.
      - name: Every route is watched by something
        run: python scripts/audit_coverage.py

      - name: Nothing unreachable, shadowed or dangling
        run: |
          python scripts/shadowed_routes.py
          python scripts/unreachable_code.py
          python scripts/dangling_references.py

      - name: Every declared parameter is read, and has an effect
        run: |
          python scripts/unread_params.py
          python scripts/param_effect.py
          python scripts/filter_effect.py
          python scripts/filter_spellings.py

      - name: Answers agree with themselves
        run: |
          python scripts/consistency_audit.py
          python scripts/type_stability_audit.py
          python scripts/paging_audit.py
          python scripts/roundtrip_audit.py

      - name: Refusals a client can parse, and rights it must have
        run: |
          python scripts/error_envelope_audit.py
          python scripts/authz_audit.py
          python scripts/method_drift.py
          python scripts/body_audit.py
          python scripts/http_contract_audit.py

      # data/ is gitignored, so without this the spec is absent and the
      # check does not run — the same reason the field-drift job fetches it.
      - name: Fetch SentinelOne API spec
        run: ./scripts/fetch_swagger.sh

      - name: Enum values the vendor declares
        run: python scripts/enum_drift.py

      # All six mounts it supports: five read specifications vendored under
      # data/vendor-specs, and SentinelOne reads the one fetched above — so
      # this needs nothing but the mock, which is the premise of this job.
      # It found a Sentinel response built to the wrong shape at every level:
      # `{"properties": ...}` where the swagger says
      # `{"value": [{"properties": ...}]}`, and `patternType`/`value` where
      # it says `metricName`/`metricValue`.  It had never seen that route,
      # because it exercises GETs and the route was served on POST alone.
      - name: Responses carry what the specification declares
        run: |
          python scripts/schema_drift.py crowdstrike
          python scripts/schema_drift.py mde
          python scripts/schema_drift.py xdr
          python scripts/schema_drift.py sentinel
          python scripts/schema_drift.py graph
          python scripts/schema_drift.py sentinelone

  field-drift:
    name: Field drift — swagger spec vs mock responses
    runs-on: ubuntu-latest
    needs: [backend-quality]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend server
        run: |
          cd backend && python -m uvicorn main:app --host 0.0.0.0 --port 8001 --no-server-header &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8001/web/api/v2.1/system/status > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      # data/ is gitignored, so without this the spec is absent and the check
      # skipped — reporting success while comparing nothing.
      - name: Fetch SentinelOne API spec
        run: ./scripts/fetch_swagger.sh

      - name: Run field-drift check
        run: |
          python scripts/field_drift.py \
            --base-url http://localhost:8001/web/api/v2.1 \
            --require-spec

  # ── Secret Scanning ─────────────────────────────────────────────────────────
  secret-scanning:
    name: Secret scanning — gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact

  # ── Docker ───────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — build verification
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t mockdr:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name mockdr-ci -p 5001:5001 mockdr:ci
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors \
            http://localhost:5001/web/api/v2.1/system/status
          # server/info requires auth, as on splunkd; the mount check must
          # authenticate, or it reports the mock broken for being right.
          curl --fail -u admin:mockdr-admin 'http://localhost:5001/splunk/services/server/info?output_mode=json'
          curl --fail "http://localhost:5001/sentinel/providers/Microsoft.SecurityInsights/operations?api-version=2024-03-01"
          docker stop mockdr-ci

  # ── Container Scanning ─────────────────────────────────────────────────────
  container-scanning:
    name: Container scanning — Trivy
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - uses: actions/checkout@v6

      # TODO(2026-03-17): Reuse the image from docker-build job via actions/upload-artifact
      # and actions/download-artifact (or docker save/load with actions/cache) to avoid
      # rebuilding the Docker image. Tracked as a CI optimisation task.
      - name: Build image
        run: docker build -t mockdr:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mockdr:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run Trivy (SARIF report)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: mockdr:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 30

  # ── SBOM Generation ────────────────────────────────────────────────────────
  sbom:
    name: SBOM — software bill of materials
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t mockdr:ci .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: mockdr:ci
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
