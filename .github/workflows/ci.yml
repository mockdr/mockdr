name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-quality:
    name: Backend — lint / type-check / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy --strict --allow-any-generics . --ignore-missing-imports --exclude tests/

      # Coverage through `sys.monitoring` rather than `settrace`, which
      # 3.12 added and coverage.py uses when asked. Measured over the whole
      # suite on this project: 197s with the default tracer against 139s
      # with this, for byte-identical numbers — 27 956 statements, 2 284
      # missed, 92 % either way. This job is 29 of CI's 31 minutes and every
      # other job finishes inside three, so it is the wall clock.
      - name: Test + coverage (85% gate)
        env:
          COVERAGE_CORE: sysmon
        run: pytest --cov --cov-fail-under=85

      - name: Critical-path tests (must all pass)
        run: pytest -m critical --no-cov

      - name: Security audit (pip-audit)
        run: pip-audit

      - name: SAST (bandit)
        run: bandit -r . -x ./tests,./.venv -ll

      # The reducers and probes are the fidelity tooling; they were the only
      # Python in the repository nothing linted.
      - name: Lint the scripts (ruff)
        run: ruff check ../scripts

      - name: License compliance (pip-licenses)
        # Exclude own package — BSL 1.1, not in deny-list scope
        run: |
          pip-licenses --format=plain --with-license-file --no-license-path --ignore-packages mockdr
          pip-licenses --fail-on="GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later" --ignore-packages mockdr

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-quality:
    name: Frontend — lint / type-check / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env from example
        run: cp .env.example .env

      - name: Lint (eslint — zero warnings)
        run: npx eslint src/ --max-warnings=0

      - name: Type-check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Unit tests + coverage
        run: npx vitest run --coverage

      - name: Security audit (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: License compliance (license-checker)
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0;GPL-2.0"

  # ── E2E ──────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright critical flows
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install Node dependencies
        run: npm ci
        working-directory: frontend

      - name: Create frontend .env from example
        run: cp .env.example .env
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  # ── Field Drift ─────────────────────────────────────────────────────────────
  hostile-inputs:
    name: Hostile inputs — parser fuzzing and hostile-body probing
    runs-on: ubuntu-latest
    needs: [backend-quality]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # Both found their bugs after a release until 2.0.5 made them a release
      # step; as a job they find them before the merge.
      - name: Fuzz the hand-written parsers
        run: python scripts/fuzz_parsers.py

      - name: Hostile bodies and parameters on every route
        run: python scripts/hostile_probe.py

  # ── Audits ──────────────────────────────────────────────────────────────────
  audits:
    name: Audits — the ones that need nothing but the mock
    runs-on: ubuntu-latest
    needs: [backend-quality]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # These have been release tools run by hand, and "by hand" is how a
      # regression reaches main. The ones needing a real product stay in the
      # conformance workflow; every one of these reads the mock alone and
      # fails on what it finds.
      - name: Every route is watched by something
        run: python scripts/audit_coverage.py

      - name: Nothing unreachable, shadowed or dangling
        run: |
          python scripts/shadowed_routes.py
          python scripts/unreachable_code.py
          python scripts/dangling_references.py

      - name: Every declared parameter is read, and has an effect
        run: |
          python scripts/unread_params.py
          python scripts/param_effect.py
          python scripts/filter_effect.py
          python scripts/filter_spellings.py

      - name: Answers agree with themselves
        run: |
          python scripts/consistency_audit.py
          python scripts/type_stability_audit.py
          python scripts/paging_audit.py
          python scripts/roundtrip_audit.py

      # And with the clock. Every other check asks whether a field is shaped
      # right; this asks whether the story it tells is possible. Nine pairs
      # were not — a threat updated five days before it was detected, an
      # investigation that ended before it began — each from drawing the two
      # moments independently in a seeder.
      - name: Time runs forwards in every record
        run: python scripts/causality_audit.py

      # data/ is gitignored, so without this the spec is absent and every
      # check that reads it quietly checks less — the same reason the
      # field-drift job fetches it. It sits here rather than further down
      # because `method_drift.py` below reads it too: without it that check
      # compared 151 documented operations instead of 247, printed a note
      # among a hundred other lines, and exited 0.
      - name: Fetch SentinelOne API spec
        run: ./scripts/fetch_swagger.sh

      - name: Refusals a client can parse, and rights it must have
        run: |
          python scripts/error_envelope_audit.py
          python scripts/authz_audit.py
          python scripts/method_drift.py
          python scripts/body_audit.py
          python scripts/http_contract_audit.py

      - name: Enum values the vendor declares
        run: python scripts/enum_drift.py

      # "No evidence, no route": a route this mock serves that the vendor
      # does not publish. `param_drift.py` had been listing them since it
      # was written — nine of them — and nothing in CI ever ran it. The
      # seven that remain are named in the script with what to use instead,
      # and an eighth fails here.
      - name: No route the vendor does not publish
        run: python scripts/param_drift.py

      # `body_audit.py` above asks whether a write route reads its body at
      # all. This asks whether the members it accepts are applied, which is a
      # different question: `PUT /tenant/policy` refused an empty body and an
      # undeclared member, and then ignored 43 of the 51 members the swagger
      # documents. It needs the spec fetched above for the body schemas.
      - name: Members a write route accepts take effect
        run: python scripts/write_effect.py

      # The frontend's Graph tests mount their views over answers captured
      # from this mock rather than hand-written ones, because a hand-written
      # fixture is a guess and one of them guessed wrong — a view read a
      # property off a null the product really answers, rendered nothing, and
      # 2 103 unit tests passed over the blank page. Captured is not current,
      # so the capture is re-asked here.
      - name: The frontend's captured fixtures still match the mock
        run: python scripts/frontend_fixture_drift.py

      # The question underneath that one: does the call arrive anywhere at
      # all? Four of the console's own buttons posted to `/threats/actions/
      # <name>`, a path family SentinelOne does not have, and every one
      # 404'd — while 2 144 unit tests passed, because they mock the client.
      - name: Every route the console calls is one the mock serves
        run: python scripts/frontend_route_drift.py

      # And the question under *that* one: does the answer carry what the
      # console says it carries? `vue-tsc` checks the views against the
      # console's own interfaces, never the interfaces against the API, so an
      # interface copied from a seeder rather than a vendor schema type-checks
      # perfectly and renders nothing. That is how eight blank timeline events
      # reached a tab, and how five Defender names the vendor does not use
      # (`alertId`, `creationTime`, `softwareId`, `vulnerabilityId`,
      # `agentVersion`) sat in four types with views reading every one.
      - name: Every field the console declares is one the answer carries
        run: python scripts/frontend_type_drift.py

      # The same question on the write side. A member the vendor does not
      # document is not refused by anything -- the route reads what it knows
      # and drops the rest -- so the console gets its 200 and the field it
      # meant to set stays as it was. It found the console posting `ids` to
      # two Falcon routes that require `composite_ids`: accepted here, a 400
      # in production. 30 of 44 literals are comparable; the rest are named.
      - name: Every member the console writes is one the vendor documents
        run: python scripts/frontend_body_drift.py

      # And the third face of it: a parameter a route does not declare is
      # dropped in silence, so the list answers 200 with rows -- just not the
      # filtered, sorted or paged ones. Nine Graph collections ignored the
      # `$top` that 22 of their siblings read, and the console asked four of
      # them for a page and got the estate.
      - name: Every parameter the console sends is one the route reads
        run: python scripts/frontend_param_drift.py

      # Those three ask about names. This one asks about values: a comparison
      # against a string the API never answers with is a branch that never
      # runs -- a badge that never colours, a filter that matches nothing --
      # and the field is real, the comparison well typed, the page fine. It
      # found fifteen Graph incidents that were all `active` while the alerts
      # under them were new, in progress and resolved.
      - name: Every value the console tests for is one a vendor answers with
        run: python scripts/frontend_value_drift.py

      # Those ask whether the mock matches a *vendor*. This asks whether it
      # matches the *protocol*, which is a different and finite question: 22
      # normative requirements from RFC 9110, 6749, 6750, 7617 and 8259 that
      # bear on an HTTP origin server serving JSON over Basic, Bearer and
      # client credentials. It found no answer carrying the `Date` §6.6.1
      # obliges — uvicorn stopped adding one and nothing here made up the
      # difference. Where a product breaks a requirement the simulation
      # follows it, and those are listed by name with the measurement.
      # `Date` is added by the ASGI server after the app has answered, so an
      # in-process client cannot see it at all. One instance, for that check.
      - name: An instance for the checks that measure the server layer
        run: |
          (cd backend && python -m uvicorn main:app --port 8123 --log-level warning &)
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8123/web/api/v2.1/system/status >/dev/null && break
            sleep 1
          done

      # The env goes in a block, not on the command: ci.sh reads this file to
      # learn what to run, and an inline assignment travelled into the mirror
      # as part of the command it was supposed to execute.
      - name: Every requirement the protocols make of an origin server
        env:
          MOCKDR_HTTP_BASE: http://localhost:8123
        run: python scripts/rfc_conformance.py

      # All six mounts it supports: five read specifications vendored under
      # data/vendor-specs, and SentinelOne reads the one fetched above — so
      # this needs nothing but the mock, which is the premise of this job.
      # It found a Sentinel response built to the wrong shape at every level:
      # `{"properties": ...}` where the swagger says
      # `{"value": [{"properties": ...}]}`, and `patternType`/`value` where
      # it says `metricName`/`metricValue`.  It had never seen that route,
      # because it exercises GETs and the route was served on POST alone.
      - name: Responses carry what the specification declares
        run: |
          python scripts/schema_drift.py crowdstrike
          python scripts/schema_drift.py mde
          python scripts/schema_drift.py xdr
          python scripts/schema_drift.py sentinel
          python scripts/schema_drift.py graph
          python scripts/schema_drift.py sentinelone

  field-drift:
    name: Field drift — swagger spec vs mock responses
    runs-on: ubuntu-latest
    needs: [backend-quality]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend server
        run: |
          cd backend && python -m uvicorn main:app --host 0.0.0.0 --port 8001 --no-server-header &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8001/web/api/v2.1/system/status > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      # data/ is gitignored, so without this the spec is absent and the check
      # skipped — reporting success while comparing nothing.
      - name: Fetch SentinelOne API spec
        run: ./scripts/fetch_swagger.sh

      - name: Run field-drift check
        run: |
          python scripts/field_drift.py \
            --base-url http://localhost:8001/web/api/v2.1 \
            --require-spec

  # ── Secret Scanning ─────────────────────────────────────────────────────────
  secret-scanning:
    name: Secret scanning — gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact

  # ── Docker ───────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — build verification
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t mockdr:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name mockdr-ci -p 5001:5001 mockdr:ci
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors \
            http://localhost:5001/web/api/v2.1/system/status
          # server/info requires auth, as on splunkd; the mount check must
          # authenticate, or it reports the mock broken for being right.
          curl --fail -u admin:mockdr-admin 'http://localhost:5001/splunk/services/server/info?output_mode=json'
          curl --fail "http://localhost:5001/sentinel/providers/Microsoft.SecurityInsights/operations?api-version=2024-03-01"
          docker stop mockdr-ci

  # ── Container Scanning ─────────────────────────────────────────────────────
  container-scanning:
    name: Container scanning — Trivy
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - uses: actions/checkout@v6

      # TODO(2026-03-17): Reuse the image from docker-build job via actions/upload-artifact
      # and actions/download-artifact (or docker save/load with actions/cache) to avoid
      # rebuilding the Docker image. Tracked as a CI optimisation task.
      - name: Build image
        run: docker build -t mockdr:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mockdr:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run Trivy (SARIF report)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: mockdr:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 30

  # ── SBOM Generation ────────────────────────────────────────────────────────
  sbom:
    name: SBOM — software bill of materials
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t mockdr:ci .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: mockdr:ci
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
