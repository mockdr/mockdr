name: Conformance — mockdr against the real products

# The differential harness (conformance/) runs real Splunk, Elasticsearch and
# Kibana next to the mock and compares answers key for key. It is too slow
# for every push (Splunk takes minutes to provision), so it runs weekly, on
# demand, and when the harness or the two mocks it measures change.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "conformance/**"
      - "backend/api/routers/splunk/**"
      # The Elasticsearch and Kibana routers themselves, which were not
      # listed: a change to `es_search.py` or `es_alerts.py` changes exactly
      # what these probes measure and triggered no run at all.
      - "backend/api/routers/es_*.py"
      # Compression, the Elastic headers and content type, the Kibana
      # api-version header — every probe sees all of them.
      - "backend/api/middleware/**"
      - "backend/application/splunk/**"
      - "backend/application/es_**"
      - "backend/utils/splunk/**"
      - "backend/utils/es_*.py"
      - "backend/utils/kibana_*.py"
      - "backend/infrastructure/fixtures/splunk/**"
      - ".github/workflows/conformance.yml"

jobs:
  harness:
    name: Splunk / Elasticsearch / Kibana probes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: conformance

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the harness's dependencies
        run: pip install 'httpx>=0.27' 'PyYAML>=6.0'

      # Kibana needs its service account's password set before it starts, so
      # Elasticsearch comes up first.
      - name: Start Elasticsearch, Splunk and mockdr
        run: docker compose up -d --build --wait --wait-timeout 900 elasticsearch splunk mockdr

      - name: Set the kibana_system password and start Kibana
        run: |
          curl -sf -u elastic:'Probe-Passw0rd!' -X POST \
            http://localhost:19200/_security/user/kibana_system/_password \
            -H 'Content-Type: application/json' -d '{"password":"Probe-Passw0rd!"}'
          docker compose up -d --wait --wait-timeout 300 kibana

      - name: Wait for the Splunk KV store
        run: |
          for i in $(seq 1 60); do
            if curl -sk -u admin:'Probe-Passw0rd!' "https://localhost:18089/services/kvstore/status?output_mode=json" \
               | grep -q '"status":"ready"'; then echo ready; exit 0; fi
            sleep 10
          done
          echo "KV store never became ready"; exit 1

      - name: Elasticsearch + Kibana probes
        run: python -m harness.runner probes/elastic.yaml --seeded

      # `--seeded` puts the same five events into both targets' HEC first,
      # so the probes that compare result *values* have something to compare.
      # Without it a search matches nothing on the real side and every
      # semantic comparison agrees.
      - name: Splunk probes
        run: python -m harness.runner probes/splunk.yaml --seeded

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 mockdr splunk kibana

      - name: Tear down
        if: always()
        run: docker compose down -v

  load:
    name: Load test — p99 < 500 ms, errors < 1 %
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the backend
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8001 --no-access-log --no-server-header &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/web/api/v2.1/system/status >/dev/null && break
            sleep 1
          done

      # The read scenario (50 workers) is the sensitive one: it caught the
      # per-item deepcopy in the completion helpers (p99 1 s) before 2.2.0.
      # --concurrency 0.25: a 2-vCPU runner with a 50-deep queue measures the
      # runner's cores, not the mock's work. The scenarios' full worker counts
      # run on a developer machine before a release.
      - name: Run the load test
        run: |
          python ../scripts/load_test.py \
            --base-url http://127.0.0.1:8001/web/api/v2.1 --concurrency 0.25
