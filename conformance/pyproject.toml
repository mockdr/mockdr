# Mirrors the backend's gates so the harness is held to the same standard as
# the code it checks. It is a separate project because it depends on the
# services being up, not on mockdr's source.
[project]
name = "mockdr-conformance"
version = "0.1.0"
description = "Differential conformance harness: mockdr against the real products"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
disallow_any_generics = false
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation; a docstring is added where the *reason*
# for the test is not obvious from what it asserts.
"tests/**" = ["D100", "D101", "D102", "D103", "S101"]
