# Splunk conformance probes.
#
# Weighted towards refusals rather than successes, on purpose. A success is
# usually easy to get approximately right; it is the *rejections* that encode
# a product's real contract, and they are where mockdr has been wrong. The
# HEC query-string defect this harness was built after was a refusal that
# mockdr turned into a success.
#
# Real target assumes the container described in ../README.md:
#   management on 8089, HEC on 8088, self-signed certificates.
platform: splunk

endpoints:
  management:
    mock: http://localhost:5001/splunk
    real: https://localhost:18089
    verify_tls: false
  hec:
    mock: http://localhost:5001/splunk
    real: https://localhost:18088
    verify_tls: false

# Which user each target recognises. The password for the real instance is
# the one compose.yml sets, read from the same variable so neither file has
# to copy the other's literal.
credentials:
  mock: {user: admin, password: mockdr-admin}
  real: {user: admin, password: "${env:SPLUNK_PASSWORD:-Probe-Passw0rd!}"}

# Splunk states its outcome in `code`, and the human-readable `text` beside
# it. Both are compared by value: a client that branches on `code` is the
# reason mockdr exists, and `text` is stable enough in splunkd to be worth
# holding to.
# What a Splunk result row says about the instance rather than about the API:
# the bucket it came from, when it was indexed, which server holds it. Dropped
# before a `compare: values` probe looks at a row, because two installs
# legitimately differ in all of it.
volatile_fields:
  - _bkt
  - _cd
  - _indextime
  - _serial
  - _si
  - _sourcetype
  - splunk_server
  - source
  - index
  - linecount
  - punct
  - timestamp
  - eventtype
  - tag
  - date_hour
  - date_mday
  - date_minute
  - date_month
  - date_second
  - date_wday
  - date_year
  - date_zone
  # The envelope's own bookkeeping, which is the run and not the answer.
  - init_offset
  - preview
  - post_process_count

significant_keys:
  - code
  - text
  # ERROR, WARN and FATAL are not interchangeable: splunkd's search
  # dispatcher answers FATAL where the rest of the server answers ERROR, and
  # comparing the type as "a string" let that slip through.
  - type
  - dispatchState
  - isDone
  - isFailed

probes:
  # ── HEC authentication ──────────────────────────────────────────────────
  - id: hec-no-token
    endpoint: hec
    why: The credential-missing path. splunkd answers 401 code 2.
    request:
      method: POST
      path: /services/collector
      json: {event: conformance-probe}

  - id: hec-invalid-token-header
    endpoint: hec
    why: An unknown token in the documented channel. 403 code 4.
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk 00000000-0000-0000-0000-000000000000"}
      json: {event: conformance-probe}

  - id: hec-invalid-token-query
    endpoint: hec
    why: >
      The ordering that is not obvious: splunkd validates the token before it
      checks whether the query-string channel is allowed, so this is 403
      code 4 and not the code 16 that a valid token would get.
    request:
      method: POST
      path: /services/collector
      query: {token: 00000000-0000-0000-0000-000000000000}
      json: {event: conformance-probe}

  - id: hec-valid-token-query
    endpoint: hec
    why: >
      The defect that prompted this harness. A valid token by query string is
      400 code 16 unless inputs.conf enables allowQueryStringAuth; mockdr
      accepted it unconditionally through 2.0.2.
    request:
      method: POST
      path: /services/collector
      query: {token: "${hec_token}"}
      json: {event: conformance-probe}

  - id: hec-valid-token-header
    endpoint: hec
    why: The documented channel, which must succeed on both.
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      json: {event: conformance-probe}

  - id: hec-event-field-missing
    endpoint: hec
    why: A body with no `event` key. splunkd answers code 12.
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      json: {sourcetype: conformance}

  - id: hec-event-blank
    endpoint: hec
    why: An `event` present but empty, which is code 13 rather than 12.
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      json: {event: ""}

  - id: hec-malformed-json
    endpoint: hec
    why: A body that is not JSON at all. code 6.
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      content: "{not json"

  # ── Management API authentication ───────────────────────────────────────
  - id: mgmt-unauthenticated
    endpoint: management
    why: >
      splunkd's management port refuses anonymous reads. The envelope it uses
      differs from HEC's, which is itself worth holding mockdr to.
    request:
      method: GET
      path: /services/server/info
      query: {output_mode: json}

  - id: mgmt-server-info
    endpoint: management
    why: >
      The first call a client makes to establish it is talking to splunkd.
      Compared structurally: versions and GUIDs are masked, the Atom envelope
      around them is not.
    request:
      method: GET
      path: /services/server/info
      query: {output_mode: json}
      auth: basic

  - id: mgmt-unknown-endpoint
    endpoint: management
    why: What splunkd does with a path it does not serve.
    request:
      method: GET
      path: /services/no/such/endpoint
      query: {output_mode: json}
      auth: basic

  - id: mgmt-apps-local
    endpoint: management
    why: The app list a client reads to choose a namespace.
    request:
      method: GET
      path: /services/apps/local
      query: {output_mode: json, count: 1}
      auth: basic

  - id: mgmt-unknown-app
    endpoint: management
    why: A named app that does not exist — 404, and in which envelope.
    request:
      method: GET
      path: /services/apps/local/no_such_app
      query: {output_mode: json}
      auth: basic

  # ── Search jobs ─────────────────────────────────────────────────────────
  - id: search-missing-job
    endpoint: management
    why: >
      A SID that was never dispatched. splunklib calls this constantly while
      polling, so the shape of the refusal matters more than most successes.
    request:
      method: GET
      path: /services/search/jobs/0000000000.000000
      query: {output_mode: json}
      auth: basic

  - id: search-dispatch-no-query
    endpoint: management
    why: Dispatching with no search string at all.
    request:
      method: POST
      path: /services/search/jobs
      query: {output_mode: json}
      auth: basic

  - id: search-parse-does-not-exist
    endpoint: management
    why: >
      mockdr served /services/search/parse through 2.0.3. splunkd has no
      such endpoint; splunklib's Service.parse() posts to search/parser.
      A 404 here on both sides is the correct answer.
    request:
      method: POST
      path: /services/search/parse
      query: {q: "search index=x", output_mode: json}
      auth: basic

  - id: search-parser-valid
    endpoint: management
    why: >
      The parser answers a flat object — commands, eventsSearch,
      reportsSearch, normalizedSearch — not an Atom envelope. Each command
      carries its pipeline stage and stream type, which is what a client
      reads to decide whether a query is streamable.
    request:
      method: POST
      path: /services/search/parser
      content: "q=search index=x | stats count by host | head 5&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths:
      - $.remoteSearch
      - $.normalizedSearch

  - id: search-parser-invalid
    endpoint: management
    why: >
      An unrunnable query. splunkd reports it as FATAL, with the command in
      quotes and a full stop — "Unknown search command 'boguscmd'." — which
      is the text splunklib surfaces to the caller.
    request:
      method: POST
      path: /services/search/parser
      content: "q=search index=x | boguscmd y&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: search-parser-empty
    endpoint: management
    why: An empty query is "Invalid query.", also FATAL.
    request:
      method: POST
      path: /services/search/parser
      content: "q=&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: search-parser-get-is-405
    endpoint: management
    why: "The parser is POST-only; GET is refused with Allow: POST."
    request:
      method: GET
      path: /services/search/parser
      query: {q: "search index=x", output_mode: json}
      auth: basic

  - id: search-v2-parser-valid
    endpoint: management
    why: search/v2/parser is the same endpoint under the newer prefix.
    request:
      method: POST
      path: /services/search/v2/parser
      content: "q=search index=x&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths:
      - $.remoteSearch
      - $.normalizedSearch

  # ── The two 401 envelopes ───────────────────────────────────────────────
  - id: mgmt-bad-basic
    endpoint: management
    why: >
      Wrong Basic credentials. splunkd answers exactly as it does to no
      credentials at all: ERROR "Unauthorized", with a WWW-Authenticate
      challenge for realm "/splunk".
    request:
      method: GET
      path: /services/server/status
      query: {output_mode: json}
      headers: {Authorization: "Basic YWRtaW46d3Jvbmc="}

  - id: mgmt-bad-session-token
    endpoint: management
    why: >
      A session token splunkd does not recognise gets a different envelope
      from a bad password: WARN "call not properly authenticated", and no
      challenge header. Two failures, two shapes.
    request:
      method: GET
      path: /services/server/status
      query: {output_mode: json}
      headers: {Authorization: "Splunk deadbeef"}

  # ── HEC codes not yet measured for invalid-event-number ─────────────────
  - id: hec-no-data
    endpoint: hec
    why: An empty body. code 5 — does it carry invalid-event-number?
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      content: ""

  - id: hec-incorrect-index
    endpoint: hec
    why: An index the token may not write to. code 7 — event-level or not?
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      json: {event: conformance-probe, index: no_such_index_conformance}

  # ══ Widened coverage (2.0.5) ═══════════════════════════════════════════
  # Everything below was added after the first 25 probes reached zero. Each
  # names a route mockdr serves that no probe had touched.

  # ── Search job lifecycle ────────────────────────────────────────────────
  - id: job-create-and-read
    endpoint: management
    why: >
      Dispatch, then the job entry a poller reads. Structural: counts and
      sids differ, the keys and the string-typed booleans must not.
    request:
      method: POST
      path: /services/search/jobs
      content: "search=search index=main | head 1&output_mode=json&exec_mode=blocking"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: job-list
    endpoint: management
    why: The job collection splunklib's jobs.list() reads.
    # What the listed job happens to have done: which commands ran, how long
    # each took and what each phase cost, the span of the index it touched
    # (absent on a job that matched nothing), and whether the search is worth
    # summarising — which is null for a trivial one and populated for others.
    # All of it is the run, not the shape of a job.
    ignore_paths:
      - $.entry[*].content.performance
      - $.entry[*].content.searchTelemetry.desc.sourcetypes
      - $.entry[*].content.searchTelemetry.search_commands
      - $.entry[*].content.searchTelemetry.perf
      - $.entry[*].content.indexEarliestTime
      - $.entry[*].content.indexLatestTime
      - $.entry[*].content.isGoodSummarizationCandidate
      - $.entry[*].content.reduceSearch
    request:
      method: GET
      path: /services/search/jobs
      query: {output_mode: json, count: 1}
      auth: basic

  - id: job-control-unknown-action
    endpoint: management
    why: A control verb splunkd does not have.
    request:
      method: POST
      path: /services/search/jobs/0000000000.000000/control
      content: "action=explode&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: job-results-missing
    endpoint: management
    why: Results for a job that was never dispatched.
    request:
      method: GET
      path: /services/search/v2/jobs/0000000000.000000/results
      query: {output_mode: json}
      auth: basic

  - id: job-export-no-search
    endpoint: management
    why: /search/jobs/export with no search string.
    request:
      method: POST
      path: /services/search/jobs/export
      content: "output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── Saved searches ──────────────────────────────────────────────────────
  - id: saved-searches-list
    endpoint: management
    why: The collection; entry content is what splunklib hands to the caller.
    request:
      method: GET
      path: /services/saved/searches
      query: {output_mode: json, count: 1}
      auth: basic

  - id: saved-search-missing
    endpoint: management
    why: An unknown saved search, and in which envelope.
    request:
      method: GET
      path: /services/saved/searches/no_such_saved_search_conformance
      query: {output_mode: json}
      auth: basic

  - id: saved-search-create-no-name
    endpoint: management
    why: Creating without the required name.
    request:
      method: POST
      path: /services/saved/searches
      content: "search=search index=main&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── Indexes ─────────────────────────────────────────────────────────────
  - id: indexes-list
    endpoint: management
    why: data/indexes, read by clients that validate an index before writing.
    request:
      method: GET
      path: /services/data/indexes
      query: {output_mode: json, count: 1}
      auth: basic

  - id: index-missing
    endpoint: management
    why: An unknown index by name.
    request:
      method: GET
      path: /services/data/indexes/no_such_index_conformance
      query: {output_mode: json}
      auth: basic

  - id: index-create-no-name
    endpoint: management
    why: Creating an index with no name.
    request:
      method: POST
      path: /services/data/indexes
      content: "output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── Users, roles, context ───────────────────────────────────────────────
  - id: current-context
    endpoint: management
    why: authentication/current-context — how a client learns who it is.
    request:
      method: GET
      path: /services/authentication/current-context
      query: {output_mode: json}
      auth: basic

  - id: users-list
    endpoint: management
    why: The user collection and its entry shape.
    request:
      method: GET
      path: /services/authentication/users
      query: {output_mode: json, count: 1}
      auth: basic

  - id: user-missing
    endpoint: management
    why: An unknown user.
    request:
      method: GET
      path: /services/authentication/users/no_such_user_conformance
      query: {output_mode: json}
      auth: basic

  - id: roles-list
    endpoint: management
    why: authorization/roles.
    request:
      method: GET
      path: /services/authorization/roles
      query: {output_mode: json, count: 1}
      auth: basic

  - id: login-bad-password
    endpoint: management
    why: auth/login with a wrong password — the envelope a client shows the user.
    request:
      method: POST
      path: /services/auth/login
      content: "username=admin&password=wrong&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}

  - id: login-no-password
    endpoint: management
    why: auth/login with the password missing entirely.
    request:
      method: POST
      path: /services/auth/login
      content: "username=admin&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}

  # ── Fired alerts ────────────────────────────────────────────────────────
  - id: fired-alerts-list
    endpoint: management
    why: alerts/fired_alerts, the collection SOAR clients poll.
    request:
      method: GET
      path: /services/alerts/fired_alerts
      query: {output_mode: json, count: 1}
      auth: basic

  - id: fired-alert-missing
    endpoint: management
    why: An unknown fired alert.
    request:
      method: GET
      path: /services/alerts/fired_alerts/no_such_alert_conformance
      query: {output_mode: json}
      auth: basic

  # ── KV Store ────────────────────────────────────────────────────────────
  - id: kv-config-list
    endpoint: management
    why: storage/collections/config in the search app namespace.
    ignore_paths:  # a collection's own schema fields: data, not shape
      - $.entry[*].content.field
      - $.entry[*].content.accelerated_fields
    request:
      method: GET
      path: /servicesNS/nobody/search/storage/collections/config
      query: {output_mode: json, count: 1}
      auth: basic

  - id: kv-collection-missing
    endpoint: management
    why: Data from a collection that does not exist; splunklib json.loads this.
    request:
      method: GET
      path: /servicesNS/nobody/search/storage/collections/data/no_such_collection_conformance
      auth: basic

  - id: kv-query-bad-json
    endpoint: management
    why: A query parameter that is not JSON.
    request:
      method: GET
      path: /servicesNS/nobody/search/storage/collections/data/no_such_collection_conformance
      query: {query: "{not json"}
      auth: basic

  - id: kv-config-create-no-name
    endpoint: management
    why: Creating a collection with no name.
    request:
      method: POST
      path: /servicesNS/nobody/search/storage/collections/config
      content: "output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── HEC variants ────────────────────────────────────────────────────────
  - id: hec-raw-valid
    endpoint: hec
    why: collector/raw with a text body; the success envelope.
    request:
      method: POST
      path: /services/collector/raw
      headers: {Authorization: "Splunk ${hec_token}"}
      content: "conformance raw event"

  - id: hec-raw-empty
    endpoint: hec
    why: collector/raw with nothing.
    request:
      method: POST
      path: /services/collector/raw
      headers: {Authorization: "Splunk ${hec_token}"}
      content: ""

  - id: hec-health
    endpoint: hec
    why: The one unauthenticated health endpoint splunkd has.
    request:
      method: GET
      path: /services/collector/health

  - id: hec-ack-no-channel
    endpoint: hec
    why: Querying acks without a channel.
    request:
      method: POST
      path: /services/collector/ack
      headers: {Authorization: "Splunk ${hec_token}"}
      json: {acks: [0]}

  - id: hec-event-array-body
    endpoint: hec
    why: A top-level JSON array, which HEC does not take as a batch.
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      json: [{event: a}, {event: b}]

  - id: hec-time-not-numeric
    endpoint: hec
    why: A `time` field that is not an epoch.
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      json: {event: p, time: yesterday}

  - id: hec-get-not-allowed
    endpoint: hec
    why: GET on the collector.
    request:
      method: GET
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}

  # ── Server ──────────────────────────────────────────────────────────────
  - id: server-status
    endpoint: management
    why: server/status, a second server endpoint with its own content.
    request:
      method: GET
      path: /services/server/status
      query: {output_mode: json}
      auth: basic

  - id: services-root
    endpoint: management
    why: The service catalogue a client walks first.
    request:
      method: GET
      path: /services
      query: {output_mode: json}
      auth: basic

  - id: xml-default
    endpoint: management
    why: >
      No output_mode at all: splunkd answers Atom XML. The content-type and
      the fact that it is not JSON are what this compares.
    request:
      method: GET
      path: /services/server/info
      auth: basic

  # ══ Measurements the review asked for ══════════════════════════════════
  # Each probe below turns an inference in the code into a measurement.

  - id: parser-pipe-in-quotes
    endpoint: management
    why: A pipe inside a quoted string is not a stage boundary.
    request:
      method: POST
      path: /services/search/parser
      content: "q=search msg=\"a|b\" | head 5&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths: [$.remoteSearch, $.normalizedSearch]

  - id: parser-stats-uppercase-by
    endpoint: management
    why: SPL keywords are case-insensitive; `BY` and `AS` must parse like `by`/`as`.
    request:
      method: POST
      path: /services/search/parser
      content: "q=search index=x | stats dc(host) AS hosts, count(x) BY a, b&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths: [$.remoteSearch, $.normalizedSearch]

  - id: parser-top
    endpoint: management
    why: What splunkd reports for top — its args grammar is not stats'.
    request:
      method: POST
      path: /services/search/parser
      content: "q=search index=x | top limit=5 host&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths: [$.remoteSearch, $.normalizedSearch]

  - id: parser-timechart
    endpoint: management
    why: timechart's classification and args.
    request:
      method: POST
      path: /services/search/parser
      content: "q=search index=x | timechart span=1h count by host&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths: [$.remoteSearch, $.normalizedSearch]

  - id: parser-rare-sort-dedup-tail
    endpoint: management
    why: Four report-stage commands whose pipeline/streamType were inferred.
    request:
      method: POST
      path: /services/search/parser
      content: "q=search index=x | rare host | sort -count | dedup host | tail 3&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths: [$.remoteSearch, $.normalizedSearch]

  - id: parser-streaming-only-with-sort
    endpoint: management
    why: Is a query ending in sort still "streaming"? isStreamingSearch was inferred.
    request:
      method: POST
      path: /services/search/parser
      content: "q=search index=x | sort -count&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths: [$.remoteSearch, $.normalizedSearch]

  - id: parser-makeresults
    endpoint: management
    why: >
      A command splunkd has and mockdr cannot run. Refusing it with splunkd's
      own "Unknown search command" wording makes a mockdr limitation look
      like a user error.
    request:
      method: POST
      path: /services/search/parser
      content: "q=| makeresults count=1 | head 1&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths: [$.remoteSearch, $.normalizedSearch]

  - id: parser-leading-pipe
    endpoint: management
    why: A generating command first — no `search` stage should appear.
    request:
      method: POST
      path: /services/search/parser
      content: "q=| inputlookup x.csv | head 1&output_mode=json"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic
    ignore_paths: [$.remoteSearch, $.normalizedSearch]

  - id: method-not-allowed-shape
    endpoint: management
    why: "The general 405: DELETE on server/info. Which type, which text?"
    request:
      method: DELETE
      path: /services/server/info
      query: {output_mode: json}
      auth: basic

  - id: job-subresource-of-unknown-sid
    endpoint: management
    why: "results_preview of a job that does not exist — Unknown sid. or Unknown endpoint.?"
    request:
      method: GET
      path: /services/search/jobs/0000000000.000000/results_preview
      query: {output_mode: json}
      auth: basic

  - id: hec-batch-second-bad
    endpoint: hec
    why: "[ok, blank] — position 1."
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      content: '{"event":"ok"}{"event":""}'

  - id: hec-batch-second-bad-index
    endpoint: hec
    why: "[ok, bad-index] — code 7 reports 2, one higher than the position."
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      content: '{"event":"ok"}{"event":"p","index":"no_such_index_conformance"}'

  - id: hec-batch-blank-then-unparseable
    endpoint: hec
    why: >
      A streaming parser reports the blank event at 0 before it ever sees
      the broken JSON at 1; a parse-everything-first one reports code 6 at 1.
    request:
      method: POST
      path: /services/collector
      headers: {Authorization: "Splunk ${hec_token}"}
      content: '{"event":""}{not json'

  - id: hec-raw-bad-index
    endpoint: hec
    why: collector/raw with ?index= outside the allow-list.
    request:
      method: POST
      path: /services/collector/raw
      query: {index: no_such_index_conformance}
      headers: {Authorization: "Splunk ${hec_token}"}
      content: "raw probe"

  # ── Time modifiers (2.3.0) ──────────────────────────────────────────────
  - id: search-invalid-time-term
    endpoint: management
    why: >
      A time modifier the grammar has no unit for. splunkd dispatches the
      job, returns nothing and says so with a FATAL message; mockdr used to
      drop the bound it could not read and answer with every event in the
      index — a full result set here and an empty one in production.
    request:
      method: POST
      path: /services/search/jobs
      content: "search=search index=main earliest=-30x&output_mode=json&exec_mode=oneshot"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: search-invalid-latest-term
    endpoint: management
    why: The same refusal, naming `latest` instead.
    request:
      method: POST
      path: /services/search/jobs
      content: "search=search index=main latest=nope&output_mode=json&exec_mode=oneshot"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: search-invalid-earliest-parameter
    endpoint: management
    why: >
      The same value as a request parameter rather than in the search string,
      which splunkd refuses with 400 rather than a message inside a 200.
    request:
      method: POST
      path: /services/search/jobs
      content: "search=search index=main&earliest_time=-30x&output_mode=json&exec_mode=oneshot"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: search-latest-not-after-earliest
    endpoint: management
    why: >
      Equal bounds as parameters. splunkd insists latest be strictly after
      earliest, though it accepts the same pair inside the search string.
    request:
      method: POST
      path: /services/search/jobs
      content: "search=search index=main&earliest_time=-5m&latest_time=-5m&output_mode=json&exec_mode=oneshot"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: search-timerange-substituted
    endpoint: management
    why: >
      A readable modifier written into the search draws an INFO line naming
      the substitution; the same value as a parameter draws nothing. Scoped
      to an index neither target has, because the envelope itself differs
      between a page with rows and one without — which is the next probe.
    request:
      method: POST
      path: /services/search/jobs
      content: "search=search index=conformance_absent_xyz earliest=-1mon@mon&output_mode=json&exec_mode=oneshot"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: search-empty-result-envelope
    endpoint: management
    why: >
      A search that matched nothing. splunkd drops `fields` and `highlighted`
      and adds `post_process_count`; mockdr sent empty ones of the first two
      and neither `preview` nor `post_process_count` at all.
    request:
      method: POST
      path: /services/search/jobs
      content: "search=search index=conformance_absent_xyz&output_mode=json&exec_mode=oneshot"
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── Seeded semantics: the same events on both sides (2.3.0) ─────────────
  #
  # These need --seeded, which puts the same five events into both targets'
  # HEC before anything runs. Without it the real install matches nothing
  # and every comparison agrees, which is how a mock's semantics stay
  # wrong while its shapes look right.

  - id: spl-stats-count
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      The simplest transforming search there is.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats count&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-by-host
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      splunkd sorts the groups by the by-fields; mockdr returned them in the order the events arrived, so the first row was whichever host the search hit first.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats count by host&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-by-two-fields
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      Two by-fields sort left to right.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats count by host, action&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-sum-by
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      A numeric aggregate per group.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats sum(sev) by host&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-avg
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      How an average renders when it divides evenly.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats avg(sev)&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-dc-values
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      A single-valued field is a string in splunkd's JSON, not a one-element array.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats dc(user), values(user)&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-spread
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      The spread statistics splunkd documents. mockdr reported them as unknown functions, so a dashboard asking for a standard deviation got an error where splunkd answers a number.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats stdev(sev), stdevp(sev), var(sev), varp(sev), sumsq(sev)&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-percentiles
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      Percentiles interpolate between ranks.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats median(sev), perc95(sev), perc25(sev)&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-earliest-latest
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      These read event time, which is what separates them from first() and last().
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats earliest(sev), latest(sev)&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-by-absent-field
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      A row that does not carry the by-field joins no group, so this is empty rather than one group keyed on the empty string.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats count by nope&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-top-action
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      top carries _tc, the total the shares are of, and renders the share with six decimals.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | top action&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-top-limit
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      limit= is an option, not a field to count.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | top limit=1 host&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-top-showperc-false
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      So is showperc; counting it as a field produced a bucket keyed on the literal string.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | top action showperc=f&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-rare-action
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      rare orders the other way.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | rare action&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-sort-ascending
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      The sort itself.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | sort sev | table sev&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-sort-descending
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      And the other direction.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | sort -sev | table sev&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-head-after-sort
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      head keeps pipeline order.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | sort sev | head 2 | table sev&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-tail-after-sort
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      tail returns its rows reversed, so this leads with the largest. mockdr returned them in pipeline order, making the first row the smallest.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | sort sev | tail 2 | table sev&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-dedup-host
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      One row per distinct value.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | dedup host | table host&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-arithmetic
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      eval reaches the row.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | sort sev | eval double=sev*2 | table sev, double&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-round-precision
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      round keeps the precision it was asked for -- round(10,2) is 10.00 -- and rounds a half away from zero, where Python rounds it to even.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | head 1 | eval a=round(10,2), b=round(10.5), c=round(10.567,1) | table a, b, c&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-conditional
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      A conditional, then a group-by over what it produced.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | eval x=if(sev>25,"high","low") | stats count by x&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-where-filter
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      where after the search.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | where sev > 25 | sort sev | table sev&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-rename-field
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      rename carries through to table.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | rename sev as severity | sort severity | table severity&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-table-absent-field
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      A field no row has: splunkd emits no rows and says so, where mockdr invented an empty column.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | table nope&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-table-partly-absent
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      And drops it per row when another field is present.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | sort host | table host, nope&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-search-parenthesised-or
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      A parenthesised group in the search clause. mockdr parsed the preceding word as a function call and answered 500.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} (action=allow OR action=block) | stats count&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-search-negated-group
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      The same, negated.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} NOT (action=allow) | stats count&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-search-wildcard-value
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      A wildcard on the right of a comparison.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} user=a* | stats count&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-unknown-function
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      A command that cannot run is FATAL and returns no rows; mockdr reported it as a warning and answered with the rows it had reached.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | eval x=nosuchfunc(1)&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-where-unknown-function
    endpoint: management
    needs_seed: true
    compare: values
    why: >
      The same failure from where, which splunkd names differently from eval.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | where nosuchfunc(1)&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── Query parameters the management API checks (2.3.0) ─────────────────
  #
  # splunkd checks the output mode, the sort direction, and every argument
  # name against the handler's own list. mockdr took all three and answered
  # 200 — three ways of telling a client its parameter worked.

  - id: splunk-param-output-mode-unknown
    endpoint: management
    why: >
      A mode splunkd does not know. The refusal renders as XML whatever was asked for, because the mode it would answer in is the thing it could not read.
    request:
      method: GET
      path: /services/saved/searches
      query: {"output_mode": "nonsense"}
      auth: basic

  - id: splunk-param-output-mode-empty
    endpoint: management
    why: >
      An empty mode is no mode.
    request:
      method: GET
      path: /services/saved/searches
      query: {"output_mode": ""}
      auth: basic

  - id: splunk-param-output-mode-unsupported
    endpoint: management
    why: >
      A mode it knows but this handler will not serve, which it says in different words and a different severity.
    request:
      method: GET
      path: /services/saved/searches
      query: {"output_mode": "raw"}
      auth: basic

  - id: splunk-param-sort-dir-unknown
    endpoint: management
    why: >
      A direction a collection does not sort by; mockdr sorted the default way and said nothing.
    request:
      method: GET
      path: /services/data/indexes
      query: {"output_mode": "json", "sort_dir": "x"}
      auth: basic

  - id: splunk-param-sort-dir-asc
    endpoint: management
    why: >
      And one it does.
    request:
      method: GET
      path: /services/data/indexes
      query: {"output_mode": "json", "sort_dir": "asc", "count": "1"}
      auth: basic
    ignore_paths:
      - $.entry
      - $.paging

  - id: splunk-param-jobs-sort-unpaired
    endpoint: management
    why: >
      The job collection sorts on several keys at once, so it pairs each with a direction and refuses a mismatch instead.
    request:
      method: GET
      path: /services/search/jobs
      query: {"output_mode": "json", "sort_dir": "asc"}
      auth: basic

  - id: splunk-param-unknown-argument
    endpoint: management
    why: >
      An argument this handler does not declare. mockdr took anything at all, which is how a client's typo survives to production.
    request:
      method: GET
      path: /services/saved/searches
      query: {"output_mode": "json", "nosuch": "1"}
      auth: basic

  - id: splunk-param-unknown-argument-indexes
    endpoint: management
    why: >
      The same on another collection.
    request:
      method: GET
      path: /services/data/indexes
      query: {"output_mode": "json", "nosuch": "1"}
      auth: basic

  - id: splunk-param-unknown-argument-users
    endpoint: management
    why: >
      And another.
    request:
      method: GET
      path: /services/authentication/users
      query: {"output_mode": "json", "nosuch": "1"}
      auth: basic

  - id: splunk-param-argument-taken-by-jobs
    endpoint: management
    why: >
      The job collection has a dispatcher of its own and takes it.
    request:
      method: GET
      path: /services/search/jobs
      query: {"output_mode": "json", "nosuch": "1"}
      auth: basic
    ignore_paths:
      - $.entry
      - $.paging

  # ── output_mode=csv, where splunkd serves it (2.3.1) ───────────────────
  #
  # It is real, but only on four paths: a job's results and events, the
  # job itself, and the job collection. mockdr refused it everywhere.
  # The rows and the quoting are compared with the seeded probes below;
  # these check who answers at all.

  - id: splunk-csv-job-collection
    endpoint: management
    why: >
      The job collection is one of the four that answer as CSV.
      Compared for status and type: the column order is splunkd's own
      key order, which is not derivable from outside.
    ignore_paths:
      - $
    request:
      method: GET
      path: /services/search/jobs
      query: {output_mode: csv, count: "1"}
      auth: basic

  - id: splunk-csv-refused-saved-searches
    endpoint: management
    why: >
      Everywhere but those four, csv is a mode splunkd knows and will
      not serve here — a different message and severity from a mode it
      does not know at all.
    request:
      method: GET
      path: /services/saved/searches
      query: {output_mode: csv}
      auth: basic

  - id: splunk-csv-refused-indexes
    endpoint: management
    why: >
      Everywhere but those four, csv is a mode splunkd knows and will
      not serve here — a different message and severity from a mode it
      does not know at all.
    request:
      method: GET
      path: /services/data/indexes
      query: {output_mode: csv}
      auth: basic

  - id: splunk-csv-refused-users
    endpoint: management
    why: >
      Everywhere but those four, csv is a mode splunkd knows and will
      not serve here — a different message and severity from a mode it
      does not know at all.
    request:
      method: GET
      path: /services/authentication/users
      query: {output_mode: csv}
      auth: basic

  - id: splunk-csv-refused-hec-inputs
    endpoint: management
    why: >
      Everywhere but those four, csv is a mode splunkd knows and will
      not serve here — a different message and severity from a mode it
      does not know at all.
    request:
      method: GET
      path: /services/data/inputs/http
      query: {output_mode: csv}
      auth: basic

  - id: splunk-csv-seeded-table
    endpoint: management
    needs_seed: true
    compare: values
    # splunkd puts a line before a oneshot's CSV that is empty on one run and
    # a single space on the next — its own streaming, not an answer.
    ignore_leading_lines: 1
    why: >
      The rows and the quoting: a value is written bare only when it is purely alphanumeric.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | sort sev | table sev, user&output_mode=csv&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: splunk-csv-seeded-stats
    endpoint: management
    needs_seed: true
    compare: values
    # splunkd puts a line before a oneshot's CSV that is empty on one run and
    # a single space on the next — its own streaming, not an answer.
    ignore_leading_lines: 1
    why: >
      A group-by rendered as CSV.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | stats count by host&output_mode=csv&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: splunk-csv-seeded-quoting
    endpoint: management
    needs_seed: true
    compare: values
    # splunkd puts a line before a oneshot's CSV that is empty on one run and
    # a single space on the next — its own streaming, not an answer.
    ignore_leading_lines: 1
    why: >
      A comma, a dot and a plain word in one row — three different quoting decisions.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | head 1 | eval c="a,b", q="x", d="1.5", plain="ok" | table c, q, d, plain&output_mode=csv&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: splunk-csv-seeded-top
    endpoint: management
    needs_seed: true
    compare: values
    # splunkd puts a line before a oneshot's CSV that is empty on one run and
    # a single space on the next — its own streaming, not an answer.
    ignore_leading_lines: 1
    why: >
      top's generated columns, including the quoted _tc.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=search index=main sourcetype=${sourcetype} | top action&output_mode=csv&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── eval functions and makeresults ──────────────────────────────────────
  #
  # `| makeresults` generates its own rows, so these probes need no seeding
  # and no index: both engines answer from the search text alone, and
  # `| table v` drops the generated `_time`, the only part that could differ.
  #
  # The pairs are chosen for the distinctions a plausible implementation
  # misses: a typed `null()` against a field the row does not have, a type
  # checked before the search runs against one checked per row, and a quoted
  # number against a field holding one.
  #
  # The search is percent-encoded because it is a form body: an unencoded
  # `+` there is a space, and an unencoded `&` ends the parameter.

  - id: spl-eval-split
    endpoint: management
    compare: values
    why: >
      split and the multivalue family.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3Dsplit%28%22a%3Bb%3Bc%22%2C%20%22%3B%22%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-split-no-separator
    endpoint: management
    compare: values
    why: >
      A split that finds no separator is the string, not a list of one.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3Dsplit%28%22abc%22%2C%20%22%3B%22%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-mvfilter
    endpoint: management
    compare: values
    why: >
      mvfilter evaluates its expression once per value of the bound field.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20m%3Dsplit%28%22a1%3Bb%3Bc2%22%2C%22%3B%22%29%20%7C%20eval%20v%3Dmvjoin%28mvfilter%28match%28m%2C%22%5Cd%22%29%29%2C%22-%22%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-mvmap
    endpoint: management
    compare: values
    why: >
      mvmap replaces each value with what the expression produces.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20m%3Dsplit%28%22a%3Bb%22%2C%22%3B%22%29%20%7C%20eval%20v%3Dmvjoin%28mvmap%28m%2Cupper%28m%29%29%2C%22-%22%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-missing-field-is-null
    endpoint: management
    compare: values
    why: >
      A function over a field the row lacks is null, not an error.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3Dupper%28nosuchfield%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-typed-null-refused
    endpoint: management
    compare: values
    why: >
      A typed null in the same place *is* an argument error - the distinction.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3Dupper%28null%28%29%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-type-check-plus
    endpoint: management
    compare: values
    why: >
      Two operands of different types are refused before a row is read.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3D%221%22%2B1%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-type-check-minus
    endpoint: management
    compare: values
    why: >
      Subtraction takes numbers, and says so in its own words.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3D%22a%22-%22b%22%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-type-check-concat-null
    endpoint: management
    compare: values
    why: >
      Concatenation will not take a typed null either.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3D%22x%22.null%28%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-field-typed-at-runtime
    endpoint: management
    compare: values
    why: >
      A field, by contrast, is typed when the row arrives: this adds.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20a%3D%221%22%20%7C%20eval%20v%3Da%2B1%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-plus-concatenates
    endpoint: management
    compare: values
    why: >
      And with a string on either side the same operator joins text.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20a%3D1%20%7C%20eval%20v%3Da%2B%222%22%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-min-max-ordering
    endpoint: management
    compare: values
    why: >
      A string ranks above every number, so max(1,"a",3) is the string.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3Dmax%281%2C%22a%22%2C3%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-min-quoted-numbers
    endpoint: management
    compare: values
    why: >
      Quoted numbers compare as text: min("10","9") is "10".
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3Dmin%28%2210%22%2C%229%22%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-json-extract
    endpoint: management
    compare: values
    why: >
      The json path grammar: dots descend into objects, {n} indexes an array.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3Djson_extract%28%22%7B%5C%22a%5C%22%3A%7B%5C%22b%5C%22%3A%5B1%2C%7B%5C%22c%5C%22%3A3%7D%5D%7D%7D%22%2C%22a.b%7B1%7D.c%22%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-validate
    endpoint: management
    compare: values
    why: >
      validate answers with the first condition that is false.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3Dvalidate%281%3D%3D2%2C%22a%22%2C1%3D%3D2%2C%22b%22%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-undefined-maths
    endpoint: management
    compare: values
    why: >
      An undefined result leaves the field unassigned rather than failing.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3Dsqrt%28-1%29%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eval-boolean-assignment
    endpoint: management
    compare: values
    why: >
      A field cannot be assigned a boolean, and splunkd suggests if().
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3D1%3D%3D1%20%7C%20table%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-count
    endpoint: management
    compare: values
    why: >
      makeresults count, the way every Splunk example starts.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20count%3D3%20%7C%20eval%20n%3D1%20%7C%20table%20n&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-count-invalid
    endpoint: management
    compare: values
    why: >
      A count that is not a non-negative integer, refused by the search processor.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20count%3D-1&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-annotate-invalid
    endpoint: management
    compare: values
    why: >
      A word that is not a boolean, refused with the option named.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20annotate%3Dmaybe&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-duplicate-option
    endpoint: management
    compare: values
    why: >
      The same option twice.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20count%3D2%20count%3D3&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-not-first
    endpoint: management
    compare: values
    why: >
      A generating command cannot follow rows that already exist.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20%7C%20eval%20v%3D1%20%7C%20makeresults%20count%3D1&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-inline-csv
    endpoint: management
    compare: values
    why: >
      Inline CSV data: the header names the fields, and no _time is added.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22a%2Cb%0A1%2C2%0A3%2C4%22&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-inline-json
    endpoint: management
    compare: values
    why: >
      Inline JSON keeps each object as _raw beside its fields.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Djson%20data%3D%22%5B%7B%5C%22a%5C%22%3A1%7D%5D%22%20%7C%20table%20a%2C%20_raw&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-inline-half
    endpoint: management
    compare: values
    why: >
      format without data, which splunkd explains at length.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-inline-extra-argument
    endpoint: management
    compare: values
    why: >
      Inline data allows no other argument.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22a%0A1%22%20count%3D5&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-makeresults-inline-bad-format
    endpoint: management
    compare: values
    why: >
      Only csv and json are formats.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dxml%20data%3D%22%3Ca%2F%3E%22&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── stats and streamstats ───────────────────────────────────────────────
  #
  # Inline data again, so both engines answer from the search text alone.
  # The pairs here are about what splunkd does when an aggregation has
  # *nothing* to compute — it writes no field, where the mock wrote 0 and ""
  # — and about `median`, which is not `perc50`.

  - id: spl-stats-sum-over-text
    endpoint: management
    compare: values
    why: >
      An aggregation with nothing to compute writes no field.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20stats%20count%2C%20sum%28g%29&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-group-keeps-its-key
    endpoint: management
    compare: values
    why: >
      The group is still a row; only the field it could not compute is gone.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20stats%20sum%28g%29%20by%20n&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-nothing-computable
    endpoint: management
    compare: values
    why: >
      With no by-fields and nothing computable, there is no row at all.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20stats%20sum%28g%29&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-count-of-nothing
    endpoint: management
    compare: values
    why: >
      count over an empty result set is still a row saying 0.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20count%3D0%20%7C%20stats%20count&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-sum-of-nothing
    endpoint: management
    compare: values
    why: >
      sum over the same is not.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20count%3D0%20%7C%20stats%20sum%28n%29%20as%20s&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-text-min-max
    endpoint: management
    compare: values
    why: >
      min and max fall back to text when the field holds no numbers.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22v%0Aa%0Ab%22%20%7C%20stats%20max%28v%29%20as%20mx%2C%20min%28v%29%20as%20mn&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-mixed-min-max
    endpoint: management
    compare: values
    why: >
      And a number wins over text in the same field.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22v%0A1%0Aa%0A3%22%20%7C%20stats%20max%28v%29%20as%20mx%2C%20sum%28v%29%20as%20s&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-median-even
    endpoint: management
    compare: values
    why: >
      median averages the middle pair and rounds an exact half up.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20stats%20median%28n%29%20as%20m%2C%20perc50%28n%29%20as%20p%2C%20p90%28n%29%20as%20q&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-unknown-function
    endpoint: management
    compare: values
    why: >
      A statistic splunkd does not have, refused by name.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20stats%20nosuchfunc%28n%29&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-stats-unknown-option
    endpoint: management
    compare: values
    why: >
      An argument it cannot read at all - which the mock used to ignore.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20stats%20count%20nosucharg%3D1&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-running-count
    endpoint: management
    compare: values
    why: >
      streamstats: stats over the rows seen so far, added to each row.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20count&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-by-group
    endpoint: management
    compare: values
    why: >
      The same, counted per group.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20count%20by%20g&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-window
    endpoint: management
    compare: values
    why: >
      A window looks at the last N rows.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20count%20window%3D2&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-current-false
    endpoint: management
    compare: values
    why: >
      current=f looks only at the rows before this one.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20current%3Dfalse%20sum%28n%29%20as%20s&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-window-and-by
    endpoint: management
    compare: values
    why: >
      A window and a grouping together - the option belongs to the command, not to the by-clause it follows.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20count%20as%20c%20by%20g%20window%3D1&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-reset-on-change
    endpoint: management
    compare: values
    why: >
      reset_on_change starts again when the by-fields change.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20count%20reset_on_change%3Dtrue%20by%20g&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-reset-before
    endpoint: management
    compare: values
    why: >
      reset_before starts again at the row the expression holds for.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20reset_before%3D%22n%3E2%22%20count&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-reset-after
    endpoint: management
    compare: values
    why: >
      reset_after starts again below it.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20reset_after%3D%22n%3E2%22%20count&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-missing-by-field
    endpoint: management
    compare: values
    why: >
      A row without the by-field is left exactly as it was.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20count%20by%20nosuchfield&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-streamstats-values
    endpoint: management
    compare: values
    why: >
      A multivalue statistic accumulating down the rows.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20streamstats%20values%28g%29%20as%20v&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── the commands SOAR content uses ──────────────────────────────────────
  #
  # eventstats, mvexpand, filldown, spath, convert and bin were unknown
  # commands here, so a search using any of them was refused outright — and
  # `| table *` selected a field literally named `*`. Inline data again, so
  # both engines answer from the search text alone.

  - id: spl-eventstats-count
    endpoint: management
    compare: values
    why: >
      stats over the whole set, joined onto every row.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20eventstats%20count&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eventstats-by-group
    endpoint: management
    compare: values
    why: >
      Each row gets its own group's answer.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20eventstats%20avg%28n%29%20as%20a%20by%20g&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eventstats-nothing-to-compute
    endpoint: management
    compare: values
    why: >
      The same absent-field rule as stats.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20eventstats%20sum%28g%29%20as%20s&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-eventstats-unknown-argument
    endpoint: management
    compare: values
    why: >
      An argument it cannot read.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20eventstats%20count%20nosucharg%3D1&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-mvexpand
    endpoint: management
    compare: values
    why: >
      One row per value of a multivalue field.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20eval%20m%3Dsplit%28%22x%3By%22%2C%22%3B%22%29%20%7C%20mvexpand%20m%20%7C%20table%20n%2C%20m&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-mvexpand-limit
    endpoint: management
    compare: values
    why: >
      A limit caps the values taken from each row.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20eval%20m%3Dsplit%28%22x%3By%22%2C%22%3B%22%29%20%7C%20mvexpand%20m%20limit%3D1%20%7C%20table%20n%2C%20m&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-mvexpand-two-fields
    endpoint: management
    compare: values
    why: >
      Only one field at a time.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20mvexpand%20n%2C%20g&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-mvexpand-no-field
    endpoint: management
    compare: values
    why: >
      And a field is required.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20mvexpand&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-mvexpand-bad-limit
    endpoint: management
    compare: values
    why: >
      A limit that is not a non-negative integer is refused by the search processor, not by the command.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20eval%20m%3Dsplit%28%22x%3By%22%2C%22%3B%22%29%20%7C%20mvexpand%20m%20limit%3D-1&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-filldown
    endpoint: management
    compare: values
    why: >
      The last value a field had, carried into the rows without it.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20eval%20x%3Dif%28n%3D2%2C%22v%22%2Cnull%28%29%29%20%7C%20filldown%20x%20%7C%20table%20n%2C%20x&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-spath-flatten
    endpoint: management
    compare: values
    why: >
      Every path in the document becomes a field.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Djson%20data%3D%22%5B%7B%5C%22a%5C%22%3A%7B%5C%22b%5C%22%3A1%7D%2C%5C%22c%5C%22%3A%5B1%2C2%5D%2C%5C%22d%5C%22%3A%5B%7B%5C%22e%5C%22%3A1%7D%2C%7B%5C%22e%5C%22%3A2%7D%5D%7D%5D%22%20%7C%20spath%20%7C%20table%20a%2C%20a.b%2C%20c%2C%20c%7B%7D%2C%20d%7B%7D.e&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-spath-path
    endpoint: management
    compare: values
    why: >
      A path selects one of them.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Djson%20data%3D%22%5B%7B%5C%22a%5C%22%3A%7B%5C%22b%5C%22%3A1%7D%2C%5C%22c%5C%22%3A%5B1%2C2%5D%2C%5C%22d%5C%22%3A%5B%7B%5C%22e%5C%22%3A1%7D%2C%7B%5C%22e%5C%22%3A2%7D%5D%7D%5D%22%20%7C%20spath%20path%3Da.b%20%7C%20table%20a.b&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-spath-output
    endpoint: management
    compare: values
    why: >
      And output names where it goes.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Djson%20data%3D%22%5B%7B%5C%22a%5C%22%3A%7B%5C%22b%5C%22%3A1%7D%2C%5C%22c%5C%22%3A%5B1%2C2%5D%2C%5C%22d%5C%22%3A%5B%7B%5C%22e%5C%22%3A1%7D%2C%7B%5C%22e%5C%22%3A2%7D%5D%7D%5D%22%20%7C%20spath%20output%3Dz%20path%3Dd%7B%7D.e%20%7C%20table%20z&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-spath-missing-path
    endpoint: management
    compare: values
    why: >
      A path that is not there writes nothing.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Djson%20data%3D%22%5B%7B%5C%22a%5C%22%3A%7B%5C%22b%5C%22%3A1%7D%2C%5C%22c%5C%22%3A%5B1%2C2%5D%2C%5C%22d%5C%22%3A%5B%7B%5C%22e%5C%22%3A1%7D%2C%7B%5C%22e%5C%22%3A2%7D%5D%7D%5D%22%20%7C%20spath%20path%3Dnosuch%20%7C%20table%20a.b&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-convert-num
    endpoint: management
    compare: values
    why: >
      convert num, and the field it cannot convert.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20convert%20num%28n%29%20as%20m%20%7C%20table%20m&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-convert-ctime
    endpoint: management
    compare: values
    why: >
      ctime renders an epoch, timeformat chooses how.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20convert%20timeformat%3D%22%25Y-%25m-%25d%22%20ctime%28n%29%20as%20t%20%7C%20table%20t&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-convert-unknown-type
    endpoint: management
    compare: values
    why: >
      A conversion type it does not have.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20convert%20nosuchfunc%28n%29&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-bin-span
    endpoint: management
    compare: values
    why: >
      A numeric span writes the bucket as a range.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20bin%20n%20span%3D2%20%7C%20table%20n&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-bin-decimal-span
    endpoint: management
    compare: values
    why: >
      The span decides how the edges are written.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20bin%20n%20span%3D0.5%20%7C%20table%20n&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-bin-default-span
    endpoint: management
    compare: values
    why: >
      The default span is one.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20bin%20n%20%7C%20table%20n&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-bin-bins
    endpoint: management
    compare: values
    why: >
      bins rounds the span it works out up to a power of ten.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20bin%20n%20bins%3D2%20%7C%20table%20n&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-bin-as
    endpoint: management
    compare: values
    why: >
      as names the bucket and leaves the field alone.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20bin%20n%20span%3D2%20as%20z%20%7C%20table%20z%2C%20n&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-bin-no-field
    endpoint: management
    compare: values
    why: >
      A field is required.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20bin&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-bin-unknown-argument
    endpoint: management
    compare: values
    why: >
      And an argument it cannot read is refused.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20bin%20n%20nosucharg%3D1&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-table-wildcard
    endpoint: management
    compare: values
    why: >
      `table *` is every field, not a field named `*`.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20table%20%2A&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-table-prefix-wildcard
    endpoint: management
    compare: values
    why: >
      And a prefix selects what it matches.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20table%20n%2A&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-fields-wildcard
    endpoint: management
    compare: values
    why: >
      `fields` reads the same patterns.
    request:
      method: POST
      path: /services/search/jobs
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22n%2Cg%0A1%2Ca%0A2%2Cb%0A3%2Ca%0A4%2Cb%22%20%7C%20fields%20%2A&output_mode=json&exec_mode=oneshot&count=0'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  # ── The endpoints a client checks first (2.3.1) ─────────────────────────
  #
  # An endpoint sweep against the real instance found each of these
  # answering 404 here: the simple receiver — the pre-HEC way in, still in
  # every ad-hoc script — the time parser a dashboard shows its window with,
  # the typeahead a search bar completes from, and the KV store status a
  # client checks before trusting it with anything.

  - id: spl-kvstore-status
    endpoint: management
    why: >
      Whether the KV store is ready, which a client checks first.
    request:
      method: GET
      path: /services/kvstore/status
      auth: basic

  - id: spl-timeparser
    endpoint: management
    why: >
      What a time modifier resolves to.
    request:
      method: GET
      path: /services/search/timeparser
      query: {time: '-1d@d'}
      auth: basic

  - id: spl-timeparser-invalid
    endpoint: management
    why: >
      And one splunkd cannot read.
    request:
      method: GET
      path: /services/search/timeparser
      query: {time: '-1x'}
      auth: basic

  - id: spl-typeahead-word
    endpoint: management
    why: >
      A bare word completes nothing, rather than guessing.
    request:
      method: GET
      path: /services/search/typeahead
      query: {prefix: 'sear', count: '3'}
      auth: basic

  - id: spl-receivers-simple-missing-index
    endpoint: management
    why: >
      The simple receiver refuses an index that is not there, by name.
    request:
      method: POST
      path: /services/receivers/simple
      query: {index: 'no-such-index-xyz'}
      content: 'an event'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-receivers-simple-empty
    endpoint: management
    why: >
      And an empty body, in its own words.
    request:
      method: POST
      path: /services/receivers/simple
      query: {index: 'main'}
      content: ''
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-export-json
    endpoint: management
    why: >
      The export stream: a line per row, the last one saying so.
    request:
      method: POST
      path: /services/search/jobs/export
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22host%2Csev%0Asrv-3%2C50%0Asrv-2%2C40%22&output_mode=json'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-export-json-empty
    endpoint: management
    why: >
      A search with no rows is one line saying only that.
    request:
      method: POST
      path: /services/search/jobs/export
      content: 'search=%7C%20makeresults%20count%3D0&output_mode=json'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-export-json-rows
    endpoint: management
    why: >
      The same rows, named once and listed.
    request:
      method: POST
      path: /services/search/jobs/export
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22host%2Csev%0Asrv-3%2C50%0Asrv-2%2C40%22&output_mode=json_rows'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-export-csv
    endpoint: management
    why: >
      And as CSV, quoted the way splunkd quotes.
    request:
      method: POST
      path: /services/search/jobs/export
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22host%2Csev%0Asrv-3%2C50%0Asrv-2%2C40%22&output_mode=csv'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-export-xml
    endpoint: management
    why: >
      And as the results document, fields and offsets included.
    request:
      method: POST
      path: /services/search/jobs/export
      content: 'search=%7C%20makeresults%20format%3Dcsv%20data%3D%22host%2Csev%0Asrv-3%2C50%22&output_mode=xml'
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

  - id: spl-row-mode-unsupported
    endpoint: management
    why: >
      json_rows is refused away from a job's results — in JSON, because it is a JSON mode, where atom and raw are refused in XML.
    request:
      method: GET
      path: /services/apps/local
      query: {output_mode: 'json_rows', count: '1'}
      auth: basic

  # ── The catalogues beside the data (2.3.1) ──────────────────────────────
  #
  # The endpoint sweep found each of these answering 404 here: the health
  # tree a monitor polls, the extended index list an app reads sizes from,
  # the licence a client checks before offering a feature, and the knowledge
  # objects a content pack enumerates. Where mockdr has none of a thing it
  # serves an *empty collection* — which is the difference between "this
  # deployment has none" and "this endpoint does not exist".

  - id: spl-server-health
    endpoint: management
    why: >
      The health tree, which a monitor polls.
    request:
      method: GET
      path: /services/server/health/splunkd
      auth: basic

  - id: spl-indexes-extended
    endpoint: management
    why: >
      Every index with the detail an app reads sizes from.
    request:
      method: GET
      path: /services/data/indexes-extended
      query: {count: '2'}
      auth: basic

  - id: spl-licenses
    endpoint: management
    why: >
      The licence this instance runs under.
    request:
      method: GET
      path: /services/licenser/licenses
      auth: basic

  - id: spl-grantable-capabilities
    endpoint: management
    why: >
      Which capabilities a role may hand on.
    request:
      method: GET
      path: /services/authorization/grantable_capabilities
      auth: basic

  - id: spl-macros
    endpoint: management
    why: >
      The search macros a deployment defines - `notable` among them.
    request:
      method: GET
      path: /servicesNS/nobody/search/admin/macros
      query: {count: '2'}
      auth: basic

  - id: spl-sourcetypes
    endpoint: management
    why: >
      One entry per source type, with the settings a client reads.
    request:
      method: GET
      path: /services/saved/sourcetypes
      query: {count: '2'}
      auth: basic

  - id: spl-eventtypes
    endpoint: management
    why: >
      An empty collection, not a 404.
    request:
      method: GET
      path: /services/saved/eventtypes
      query: {count: '2'}
      auth: basic

  - id: spl-lookups
    endpoint: management
    why: >
      The same for lookup definitions.
    request:
      method: GET
      path: /services/data/transforms/lookups
      query: {count: '2'}
      auth: basic

  - id: spl-lookup-files
    endpoint: management
    why: >
      And for lookup table files.
    request:
      method: GET
      path: /services/data/lookup-table-files
      query: {count: '2'}
      auth: basic

  - id: spl-inputs-monitor
    endpoint: management
    why: >
      And for monitored files.
    request:
      method: GET
      path: /services/data/inputs/monitor
      query: {count: '2'}
      auth: basic

  # ── `f`, the field filter (2.3.1) ────────────────────────────────────────
  #
  # Creating an index is deliberately *not* probed here: splunkd disables an
  # index on delete rather than removing it, so a create/delete pair cannot
  # repeat against a persistent install — the second run finds a disabled
  # index and refuses. What creation keeps is pinned by unit tests taken from
  # 10.4.2 directly. Reading is safe, and `f` is read-only.

  # Not yet imitated, and visible here: splunkd renders an entry's `id` and
  # its links in the namespaced form — `/servicesNS/{owner}/{app}/…` for the
  # collections that have an owner and an app (indexes, saved searches),
  # `/services/…` only for the global ones (authentication/users). mockdr
  # renders every id in the `/services` form. Both are reachable — the
  # namespace middleware rewrites one to the other — so a client following
  # the link works either way; one parsing owner and app out of the id does
  # not. Fixing it means measuring the owner and app of some thirty
  # collections, which is its own piece of work, so this probe compares the
  # shape rather than pretending the difference is not there.
  - id: spl-index-field-filter
    endpoint: management
    why: >
      `f` narrows an entry's content to the fields it names, and mockdr
      declared it nowhere — a client asking for two settings of an index was
      handed all 113.
    request:
      method: GET
      path: /services/data/indexes/main
      query:
        output_mode: json
        f: maxTotalDataSizeMB
      auth: basic

  - id: spl-index-field-filter-wildcard
    endpoint: management
    why: >
      `f` takes wildcards: one pattern selects every `max…` setting.
    request:
      method: GET
      path: /services/data/indexes/main
      query:
        output_mode: json
        f: max*
      auth: basic

  - id: spl-index-field-filter-unknown
    endpoint: management
    why: >
      A field that matches nothing leaves eai:acl alone, rather than erroring
      or falling back to the whole content block.
    request:
      method: GET
      path: /services/data/indexes/main
      query:
        output_mode: json
        f: zzzNoSuchField
      auth: basic

  - id: spl-saved-search-field-filter
    endpoint: management
    why: >
      And it is the framework's parameter, not one collection's: the same
      narrowing on saved searches.
    request:
      method: GET
      path: /services/saved/searches
      query:
        output_mode: json
        count: '2'
        f: search
      auth: basic

  - id: spl-index-unknown-argument
    endpoint: management
    compare: values
    why: >
      splunkd refuses an argument it does not know rather than ignoring it,
      and names the argument. Nothing is created, so this leaves no trace.
    request:
      method: POST
      path: /services/data/indexes
      query: {output_mode: json}
      content: name=zzz_conformance_reject&zzzNotAThing=1
      headers: {Content-Type: application/x-www-form-urlencoded}
      auth: basic

