# Elasticsearch and Kibana conformance probes.
#
# The two have genuinely different error envelopes — Elasticsearch nests an
# `error` object with a top-level `status`, Kibana serves Hapi/Boom with
# `statusCode` and `error` as a title string, and Kibana's Security Solution
# routes use a third shape again. A client moving between them cannot use one
# parser, which is exactly the sort of thing a mock gets wrong quietly.
platform: elastic

endpoints:
  search:
    mock: http://localhost:5001/elastic
    real: http://localhost:19200
  kibana:
    mock: http://localhost:5001/kibana
    real: http://localhost:15601

credentials:
  mock: {user: elastic, password: mock-elastic-password}
  real: {user: elastic, password: "${env:ELASTIC_PASSWORD:-Probe-Passw0rd!}"}

# What an Elasticsearch hit says about the cluster rather than about the API.
# `took` is the run's own timing and `_shards` its topology; `max_score` is
# compared, because whether a search is scored at all is behaviour.
volatile_fields:
  - took
  - _shards
  - _seq_no
  - _primary_term
  - _version
  # The node a shard failure happened on, and the settings a cluster records
  # about itself: an id, a creation time, and where it decided to put the
  # shards. None of it is an answer about the API.
  - node
  - settings
  # The uuid a shard failure names its index by: an install's own identifier.
  - index_uuid

# What happened during this run rather than what the API answers: a shard
# that was still allocating when a search reached it puts a `failures` list
# in the real reply that a mock has no equivalent for. Measured in CI, where
# a cluster is seconds old.
ignore_paths:
  - $._shards.failures
  - $.hits.hits[*]._shard
  - $._shards.skipped

significant_keys:
  - status
  - statusCode
  - error
  - type
  - reason
  - status_code

probes:
  # ── Elasticsearch ───────────────────────────────────────────────────────
  - id: es-unauthenticated
    endpoint: search
    why: Elasticsearch's refusal envelope, which is not Kibana's.
    request:
      method: GET
      path: /_cluster/health

  - id: es-cluster-health
    endpoint: search
    why: >
      The health document a client polls. Compared structurally — node counts
      and shard numbers legitimately differ, the keys reporting them must not.
    request:
      method: GET
      path: /_cluster/health
      auth: basic
    ignore_paths:
      - $.cluster_name
      # A single-node install is yellow (replicas unassigned); mockdr models
      # a healthy cluster and says green. That is fixture, not behaviour.
      - $.status

  - id: es-missing-index
    endpoint: search
    why: >
      index_not_found_exception, which carries a distinctive nested `error`
      object with `root_cause`. A flattened imitation of it is the classic
      way a mock breaks a client's error handling.
    request:
      method: GET
      path: /no-such-index-conformance/_search
      auth: basic

  - id: es-malformed-query
    endpoint: search
    why: A syntactically invalid query body — parsing_exception.
    request:
      method: POST
      path: /_search
      json: {query: {not_a_real_clause: {}}}
      auth: basic

  - id: es-search-all
    endpoint: search
    why: >
      The hit envelope itself: `hits.total.value`, `_shards`, `took`. Values
      differ between a seeded mock and an empty install; the shape must not.
    request:
      method: POST
      path: /_search
      json: {size: 0}
      auth: basic
    ignore_paths:
      # `_shards.failures` appears only when a shard failed. Kibana keeps
      # creating and rolling over its own indices while the probes run, so a
      # search across `_all` can catch one mid-allocation
      # (`no_shard_available_action_exception`). That is the cluster's state
      # at that second, not the API's shape — and a mock with no shards can
      # never produce it.
      - $._shards.failures

  # ── Kibana ──────────────────────────────────────────────────────────────
  - id: kbn-status
    endpoint: kibana
    why: >
      How a client establishes it is talking to Kibana. Unauthenticated on
      both by design.
    request:
      method: GET
      path: /api/status
    ignore_paths:
      - $.name
      - $.status.core
      - $.metrics
      - $.mockdr

  - id: kbn-missing-route
    endpoint: kibana
    why: Kibana's Boom envelope for an unserved path.
    request:
      method: GET
      path: /api/no_such_route_conformance
      auth: basic

  - id: kbn-spaces
    endpoint: kibana
    why: The space list, which a client reads before it writes anything.
    request:
      method: GET
      path: /api/spaces/space
      auth: basic

  - id: kbn-unknown-space
    endpoint: kibana
    why: >
      A space id that does not exist. mockdr returned the default space with
      a 200 here until 2.0.3, which told a client a typo had worked.
    request:
      method: GET
      path: /api/spaces/space/no-such-space-conformance
      auth: basic

  - id: kbn-detection-rules-find
    endpoint: kibana
    why: >
      The Security Solution list envelope — page/perPage/total/data — which
      differs from the platform's own list shape.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {per_page: 1}
      auth: basic

  - id: kbn-missing-xsrf
    endpoint: kibana
    why: >
      A POST without the kbn-xsrf header. Kibana refuses it with a specific
      message; accepting it would let a client omit a header it must send.
    request:
      method: POST
      path: /api/detection_engine/rules
      json: {name: conformance, description: probe, type: query, severity: low, risk_score: 1}
      auth: basic

  # ══ Widened coverage (2.0.5) ═══════════════════════════════════════════

  # ── Elasticsearch: search features ──────────────────────────────────────
  - id: es-count
    endpoint: search
    why: _count's envelope differs from _search's — no hits, a bare count.
    request:
      method: POST
      path: /_count
      json: {query: {match_all: {}}}
      auth: basic

  - id: es-aggs-terms-on-missing-index
    endpoint: search
    why: An aggregation against an index that is not there.
    request:
      method: POST
      path: /no-such-index-conformance/_search
      json: {size: 0, aggs: {by_x: {terms: {field: x}}}}
      auth: basic

  - id: es-aggs-unknown-type
    endpoint: search
    why: An aggregation type Elasticsearch does not have — which exception?
    request:
      method: POST
      path: /_search
      json: {size: 0, aggs: {a: {not_an_agg: {field: x}}}}
      auth: basic

  - id: es-size-negative
    endpoint: search
    why: A negative size is an illegal_argument_exception.
    request:
      method: POST
      path: /_search
      json: {size: -1}
      auth: basic

  - id: es-size-not-a-number
    endpoint: search
    why: A size that is not numeric.
    request:
      method: POST
      path: /_search
      json: {size: lots}
      auth: basic

  - id: es-from-too-large
    endpoint: search
    why: >
      from+size beyond the 10000 window. Scoped to the bootstrap's index: on
      `_all`, a shard the cluster is still allocating adds its own cause to
      the chain, which says nothing about the window rule.
    request:
      method: POST
      path: /${index}/_search
      json: {from: 20000, size: 10}
      auth: basic

  - id: es-body-not-an-object
    endpoint: search
    why: A JSON array where a search body is expected.
    request:
      method: POST
      path: /_search
      json: [1, 2, 3]
      auth: basic

  - id: es-mget-no-docs
    endpoint: search
    why: _mget without docs or ids.
    request:
      method: POST
      path: /_mget
      json: {}
      auth: basic

  - id: es-mget-missing-index
    endpoint: search
    why: _mget against an unknown index.
    request:
      method: POST
      path: /no-such-index-conformance/_mget
      json: {ids: ["1"]}
      auth: basic

  - id: es-mapping-missing-index
    endpoint: search
    why: _mapping for an index that does not exist.
    request:
      method: GET
      path: /no-such-index-conformance/_mapping
      auth: basic

  - id: es-index-exists-missing
    endpoint: search
    why: HEAD on an unknown index is a bare 404 with no body.
    request:
      method: HEAD
      path: /no-such-index-conformance
      auth: basic

  - id: es-cat-indices
    endpoint: search
    why: >
      _cat/indices?format=json, the row a client reads. Scoped to the
      bootstrap's index: listing everything measures Kibana creating and
      rolling over its own indices — a row whose stats are not yet available
      — rather than the shape of the row itself.
    request:
      method: GET
      path: /_cat/indices/${index}
      query: {format: json}
      auth: basic

  - id: es-cat-unknown
    endpoint: search
    why: A _cat endpoint that does not exist.
    request:
      method: GET
      path: /_cat/no_such_thing
      auth: basic

  - id: es-root
    endpoint: search
    why: GET / — the banner a client reads to learn the version.
    request:
      method: GET
      path: /
      auth: basic
    ignore_paths:
      - $.name
      - $.cluster_name
      - $.cluster_uuid
      - $.tagline

  - id: es-unknown-path
    endpoint: search
    why: A path Elasticsearch has no handler for — the envelope says "no handler found".
    request:
      method: GET
      path: /_no_such_endpoint_conformance
      auth: basic

  - id: es-bulk-empty
    endpoint: search
    why: _bulk with an empty body.
    request:
      method: POST
      path: /_bulk
      content: ""
      headers: {Content-Type: application/x-ndjson}
      auth: basic

  - id: es-bulk-bad-ndjson
    endpoint: search
    why: _bulk with a body that is not NDJSON action lines.
    request:
      method: POST
      path: /_bulk
      content: "{not json\n"
      headers: {Content-Type: application/x-ndjson}
      auth: basic

  - id: es-security-authenticate
    endpoint: search
    why: _security/_authenticate — who am I.
    request:
      method: GET
      path: /_security/_authenticate
      auth: basic
    ignore_paths:
      - $.roles
      - $.metadata
      - $.full_name
      - $.email
      - $.authentication_realm
      - $.lookup_realm

  - id: es-wrong-password
    endpoint: search
    why: Wrong Basic credentials, as opposed to none.
    request:
      method: GET
      path: /_cluster/health
      headers: {Authorization: "Basic ZWxhc3RpYzp3cm9uZw=="}

  # ── Kibana: detection rules ─────────────────────────────────────────────
  - id: kbn-rule-missing-by-id
    endpoint: kibana
    why: rules?id= for an id that does not exist.
    request:
      method: GET
      path: /api/detection_engine/rules
      query: {id: 00000000-0000-0000-0000-000000000000}
      auth: basic

  - id: kbn-rule-missing-by-rule-id
    endpoint: kibana
    why: rules?rule_id= for an unknown rule_id — a different message.
    request:
      method: GET
      path: /api/detection_engine/rules
      query: {rule_id: no-such-rule-conformance}
      auth: basic

  - id: kbn-rule-get-no-params
    endpoint: kibana
    why: rules with neither id nor rule_id.
    request:
      method: GET
      path: /api/detection_engine/rules
      auth: basic

  - id: kbn-rule-create-missing-fields
    endpoint: kibana
    why: >
      Creating a rule without required fields. The Security Solution answers
      a 400 with a message naming the first missing field.
    request:
      method: POST
      path: /api/detection_engine/rules
      json: {name: conformance}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-rule-create-bad-type
    endpoint: kibana
    why: A rule type Kibana does not have.
    request:
      method: POST
      path: /api/detection_engine/rules
      json: {name: c, description: d, type: not_a_type, severity: low, risk_score: 1}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-rules-find-bad-sort
    endpoint: kibana
    why: _find with a sort field that is not sortable.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {sort_field: no_such_field, per_page: 1}
      auth: basic

  - id: kbn-rules-find-per-page-zero
    endpoint: kibana
    why: per_page=0.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {per_page: 0}
      auth: basic

  - id: kbn-bulk-action-unknown
    endpoint: kibana
    why: rules/_bulk_action with an action Kibana does not have.
    request:
      method: POST
      path: /api/detection_engine/rules/_bulk_action
      json: {action: explode, ids: []}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-rule-delete-missing
    endpoint: kibana
    why: DELETE rules?rule_id= for an unknown rule.
    request:
      method: DELETE
      path: /api/detection_engine/rules
      query: {rule_id: no-such-rule-conformance}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-signals-search-empty
    endpoint: kibana
    why: signals/search with an empty body.
    request:
      method: POST
      path: /api/detection_engine/signals/search
      json: {}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-signals-status-no-ids
    endpoint: kibana
    why: signals/status with neither signal_ids nor query.
    request:
      method: POST
      path: /api/detection_engine/signals/status
      json: {status: closed}
      headers: {kbn-xsrf: "true"}
      auth: basic

  # ── Kibana: cases ───────────────────────────────────────────────────────
  - id: kbn-case-missing
    endpoint: kibana
    why: GET cases/{id} for an unknown case.
    request:
      method: GET
      path: /api/cases/00000000-0000-0000-0000-000000000000
      auth: basic

  - id: kbn-case-create-missing-fields
    endpoint: kibana
    why: Creating a case with only a title.
    request:
      method: POST
      path: /api/cases
      json: {title: conformance}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-cases-find-bad-status
    endpoint: kibana
    why: cases/_find with a status value Kibana does not have.
    request:
      method: GET
      path: /api/cases/_find
      query: {status: exploded}
      auth: basic

  - id: kbn-case-comment-missing-case
    endpoint: kibana
    why: Commenting on a case that does not exist.
    request:
      method: POST
      path: /api/cases/00000000-0000-0000-0000-000000000000/comments
      json: {comment: hi, type: user, owner: securitySolution}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-cases-patch-no-version
    endpoint: kibana
    why: PATCH cases without the version Kibana requires for optimistic locking.
    request:
      method: PATCH
      path: /api/cases
      json: {cases: [{id: 00000000-0000-0000-0000-000000000000, title: x}]}
      headers: {kbn-xsrf: "true"}
      auth: basic

  # ── Kibana: exception lists ─────────────────────────────────────────────
  - id: kbn-exception-list-missing
    endpoint: kibana
    why: exception_lists?list_id= for an unknown list.
    request:
      method: GET
      path: /api/exception_lists
      query: {list_id: no-such-list-conformance}
      auth: basic

  - id: kbn-exception-list-create-missing
    endpoint: kibana
    why: Creating an exception list without required fields.
    request:
      method: POST
      path: /api/exception_lists
      json: {name: c}
      headers: {kbn-xsrf: "true"}
      auth: basic

  # ── Kibana: endpoint ────────────────────────────────────────────────────
  - id: kbn-endpoint-missing
    endpoint: kibana
    why: endpoint/metadata/{id} for an unknown agent.
    request:
      method: GET
      path: /api/endpoint/metadata/00000000-0000-0000-0000-000000000000
      auth: basic

  - id: kbn-isolate-no-ids
    endpoint: kibana
    why: isolate with no endpoint_ids.
    request:
      method: POST
      path: /api/endpoint/action/isolate
      json: {}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-action-missing
    endpoint: kibana
    why: endpoint/action/{id} for an unknown action.
    request:
      method: GET
      path: /api/endpoint/action/00000000-0000-0000-0000-000000000000
      auth: basic

  # ── Kibana: platform ────────────────────────────────────────────────────
  - id: kbn-wrong-password
    endpoint: kibana
    why: Wrong Basic credentials against Kibana — its own 401 shape, not ES's.
    request:
      method: GET
      path: /api/spaces/space
      headers: {Authorization: "Basic ZWxhc3RpYzp3cm9uZw=="}

  - id: kbn-features
    endpoint: kibana
    why: /api/features, the capability list.
    request:
      method: GET
      path: /api/features
      auth: basic

  - id: kbn-fleet-agents
    endpoint: kibana
    why: fleet/agents, the inventory.
    request:
      method: GET
      path: /api/fleet/agents
      query: {perPage: 1}
      auth: basic

  # ══ Measurements the review and fuzzing asked for ══════════════════════
  - id: es-unknown-top-level-key
    endpoint: search
    why: >
      `{"a": {...}}` as a search body. Elasticsearch refuses an unknown key
      with parsing_exception; mockdr answered 200 with every hit.
    request:
      method: POST
      path: /_search
      json: {a: {b: 1}}
      auth: basic

  - id: es-search-source-param
    endpoint: search
    why: GET _search?source= carries the body in the query string.
    request:
      method: GET
      path: /_search
      query: {source: '{"query":{"bogus":{}}}', source_content_type: application/json}
      auth: basic

  - id: kbn-case-create-garbage
    endpoint: kibana
    why: >
      A body with none of the case fields. mockdr created a case with an
      empty title and answered 200.
    request:
      method: POST
      path: /api/cases
      json: {a: {b: 1}}
      headers: {kbn-xsrf: "true"}
      auth: basic

  # ── Elasticsearch: time filters and deep paging (2.3.0) ─────────────────
  #
  # A bad date-math bound is deliberately not probed here. The real target's
  # index carries no mapping for the field, so its shard never parses the
  # bound and answers 200; the refusal only appears on a mapped date field,
  # which a mock without mappings cannot arrange. That behaviour is pinned by
  # unit tests taken from 8.15 directly.
  #
  # The sorts below use `_doc` for the same reason: sorting on `@timestamp`
  # against an unmapped index fails with query_shard_exception before
  # anything under test is reached.

  - id: es-search-after-without-sort
    endpoint: search
    why: >
      search_after is meaningless without a sort, and Elasticsearch says so
      rather than paging from an arbitrary point. Shard-level, so the refusal
      arrives wrapped in a search_phase_execution_exception.
    request:
      method: POST
      path: /${index}/_search
      json: {size: 2, search_after: [1]}
      auth: basic
    ignore_paths:
      # Which shard of which index failed is the cluster's own topology.
      - $.error.failed_shards[*].index
      - $.error.failed_shards[*].node

  - id: es-search-after-length-mismatch
    endpoint: search
    why: >
      A cursor with more values than the sort has keys — the shape of a
      client that changed its sort mid-page.
    request:
      method: POST
      path: /${index}/_search
      json: {size: 2, sort: ["_doc"], search_after: [1, 2]}
      auth: basic
    ignore_paths:
      - $.error.failed_shards[*].index
      - $.error.failed_shards[*].node

  - id: es-sorted-search-envelope
    endpoint: search
    why: >
      A sorted search is not a scored one: Elasticsearch nulls `max_score`,
      and each hit carries a `sort` array instead of a `_score`. Without
      those values no client can page with search_after at all.
    request:
      method: POST
      path: /${index}/_search
      json: {size: 1, sort: ["_doc"]}
      auth: basic
    ignore_paths:
      # Hit contents are fixture: the real index here is empty, mockdr is
      # seeded. The envelope around them is what this probe compares.
      - $.hits.hits
      - $._shards
      - $.hits.total.value

  - id: es-date-histogram-removed-interval
    endpoint: search
    why: >
      `interval` was removed from date_histogram in Elasticsearch 8; a body
      still sending it is refused by name, with the position of the field
      inside the reason text. mockdr read it as a calendar interval and
      answered 200, so a client could keep an interval the real cluster
      rejects.
    request:
      method: POST
      path: /${index}/_search
      content: '{"size":0,"aggs":{"p":{"date_histogram":{"field":"@timestamp","interval":"1d"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  # ── Seeded semantics: the same documents on both sides (2.3.0) ─────────
  #
  # These need --seeded, which creates `conformance-seeded` on both targets
  # and fills it with six known documents. Every window below is anchored
  # to those documents rather than to the clock, so the expectations do not
  # drift; the two `now`-relative bounds are wide enough to stay true.

  - id: es-seeded-date-math-window
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A relative window. Compared as a string, `now-30d` was false for every document, so every Kibana time picker matched nothing.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "query": {"range": {"@timestamp": {"gte": "now-10y", "lte": "now+1y"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-date-math-anchored
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Anchored date math, which resolves to the same instant on every run.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 20, "sort": [{"name": "asc"}], "_source": ["name"], "query": {"range": {"@timestamp": {"gte": "2026-08-03T00:00:00.000Z||-1d"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-date-math-rounding-gte
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `gte: <date>||/d` rounds down, taking in the whole day.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 20, "sort": [{"name": "asc"}], "_source": ["name"], "query": {"range": {"@timestamp": {"gte": "2026-08-03T09:00:00.000Z||/d"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-date-math-rounding-lt
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `lt` rounds down too, which excludes that whole day.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 20, "sort": [{"name": "asc"}], "_source": ["name"], "query": {"range": {"@timestamp": {"lt": "2026-08-03T09:00:00.000Z||/d"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-date-math-rounding-lte
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `lte` rounds up instead, which includes it.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 20, "sort": [{"name": "asc"}], "_source": ["name"], "query": {"range": {"@timestamp": {"lte": "2026-08-03T09:00:00.000Z||/d"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-query-string-range
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Lucene's own range spelling, which had no support at all here.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 20, "sort": [{"name": "asc"}], "_source": ["name"], "query": {"query_string": {"query": "@timestamp:[2026-08-02T00:00:00.000Z TO 2026-08-11T00:00:00.000Z]"}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-query-string-field
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `@timestamp:x` names a field; the tokeniser used to read it as a bare word and search every field.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 20, "sort": [{"name": "asc"}], "_source": ["name"], "query": {"query_string": {"query": "host:srv-2"}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-sorted-hits-carry-sort-values
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A sorted hit carries the sort array a client pages with, and a sorted search is not a scored one.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 2, "sort": [{"@timestamp": "desc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-search-after-page-two
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The second page, resumed from the first page's last sort value.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 2, "sort": [{"@timestamp": "desc"}], "search_after": [1786266000000], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-missing-values-sort-last-desc
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A document without the sort field goes last whichever way the sort runs; descending used to lead with it.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 20, "sort": [{"@timestamp": "desc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-missing-values-sort-last-asc
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The same, ascending.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 20, "sort": [{"@timestamp": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-missing-values-first
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `missing: _first` puts it at the front instead.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 20, "sort": [{"@timestamp": {"order": "desc", "missing": "_first"}}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-terms
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A terms breakdown, ordered by count then key.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"by_host": {"terms": {"field": "host"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-date-histogram-days
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Every interval between the first and the last, empty ones drawn at zero — they used to be left out, so a chart skipped quiet days.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"per_day": {"date_histogram": {"field": "@timestamp", "calendar_interval": "1d"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-date-histogram-min-doc-count
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `min_doc_count` suppresses them again.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"per_day": {"date_histogram": {"field": "@timestamp", "calendar_interval": "1d", "min_doc_count": 1}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-date-histogram-week
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A calendar week begins on Monday, not on the weekday the epoch fell on.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"per_week": {"date_histogram": {"field": "@timestamp", "calendar_interval": "1w"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-date-histogram-month
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      And a calendar month is a month, not thirty days.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"per_month": {"date_histogram": {"field": "@timestamp", "calendar_interval": "1M"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-date-histogram-fixed
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A fixed interval is anchored on the epoch instead.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"per": {"date_histogram": {"field": "@timestamp", "fixed_interval": "36h"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-metrics-are-doubles
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Every numeric metric is a double, even one that divides evenly.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"a": {"avg": {"field": "sev"}}, "s": {"sum": {"field": "sev"}}, "mn": {"min": {"field": "sev"}}, "mx": {"max": {"field": "sev"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-stats
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `stats` reports a count as an int and the rest as doubles.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"s": {"stats": {"field": "sev"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-range-bucket-keys
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A range bucket's key renders its bounds as doubles.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"r": {"range": {"field": "sev", "ranges": [{"to": 25}, {"from": 25, "to": 45}, {"from": 45}]}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-agg-nested
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A metric under a bucket.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"by_host": {"terms": {"field": "host"}, "aggs": {"avg_sev": {"avg": {"field": "sev"}}}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-track-total-hits-cap
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A capped total says so with `relation: gte` rather than reporting an exact count.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "track_total_hits": 2}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-track-total-hits-false
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      And `false` reports no total at all.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "track_total_hits": false}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-seeded-count-endpoint
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `_count` has its own envelope.
    request:
      method: POST
      path: /${seed_index}/_count
      content: '{"query": {"match_all": {}}}'
      headers: {Content-Type: application/json}
      auth: basic

  # ── Kibana: what a _find query is allowed to say (2.3.0) ───────────────
  #
  # Kibana validates the whole query string before it looks at any data.
  # mockdr accepted almost all of this silently, which is the failure mode
  # the harness exists to catch: a 200 that answers a question nobody asked.

  - id: kbn-cases-find-perpage-too-high
    endpoint: kibana
    why: >
      Kibana caps a page at 100 and says so; mockdr served 101.
    request:
      method: GET
      path: /api/cases/_find
      query: {"perPage": "101"}
      auth: basic

  - id: kbn-cases-find-perpage-negative
    endpoint: kibana
    why: >
      A negative page size reaches Elasticsearch, which reports it as [size].
    request:
      method: GET
      path: /api/cases/_find
      query: {"perPage": "-1"}
      auth: basic

  - id: kbn-cases-find-page-zero
    endpoint: kibana
    why: >
      Page 0 is a negative window, reported as [from] with the offset it computed.
    request:
      method: GET
      path: /api/cases/_find
      query: {"page": "0"}
      auth: basic

  - id: kbn-cases-find-page-not-a-number
    endpoint: kibana
    why: >
      A page that is not a number.
    request:
      method: GET
      path: /api/cases/_find
      query: {"page": "bad"}
      auth: basic

  - id: kbn-cases-find-sort-field-unknown
    endpoint: kibana
    why: >
      A field this endpoint will not sort by; mockdr sorted by something else and answered 200.
    request:
      method: GET
      path: /api/cases/_find
      query: {"sortField": "nope"}
      auth: basic

  - id: kbn-cases-find-sort-field-owner
    endpoint: kibana
    why: >
      A perfectly good case field that is still not sortable here.
    request:
      method: GET
      path: /api/cases/_find
      query: {"sortField": "owner"}
      auth: basic

  - id: kbn-cases-find-sort-order-unknown
    endpoint: kibana
    why: >
      A direction that is neither asc nor desc.
    request:
      method: GET
      path: /api/cases/_find
      query: {"sortOrder": "sideways"}
      auth: basic

  - id: kbn-cases-find-severity-unknown
    endpoint: kibana
    why: >
      mockdr answered 200 with no cases, which a client reads as there being none rather than as the typo it is.
    request:
      method: GET
      path: /api/cases/_find
      query: {"severity": "nonsense"}
      auth: basic

  - id: kbn-cases-find-status-unknown
    endpoint: kibana
    why: >
      The same for status.
    request:
      method: GET
      path: /api/cases/_find
      query: {"status": "nonsense"}
      auth: basic

  - id: kbn-cases-find-unknown-key
    endpoint: kibana
    why: >
      A query key the endpoint does not have.
    request:
      method: GET
      path: /api/cases/_find
      query: {"nosuchparam": "1"}
      auth: basic

  - id: kbn-cases-find-unknown-keys
    endpoint: kibana
    why: >
      Two of them, named together.
    request:
      method: GET
      path: /api/cases/_find
      query: {"nosuchparam": "1", "another": "2"}
      auth: basic

  - id: kbn-cases-find-several-problems
    endpoint: kibana
    why: >
      Kibana reports every value it could not accept, joined, in its codec's order.
    request:
      method: GET
      path: /api/cases/_find
      query: {"status": "bad", "sortField": "bad"}
      auth: basic

  - id: kbn-cases-find-cap-after-values
    endpoint: kibana
    why: >
      And appends the page-size cap after those.
    request:
      method: GET
      path: /api/cases/_find
      query: {"perPage": "101", "sortOrder": "bad"}
      auth: basic

  - id: kbn-cases-find-sort-field-allowed
    endpoint: kibana
    why: >
      A sort this endpoint does take, compared as a shape. It is the only
      probe that reaches a case object, and it is how the members mockdr was
      missing — comments, customFields, category, duration, external_service
      — were found, along with an `alert_ids` no real case carries.
    # What each install's cases happen to hold: whether any was ever closed
    # or updated, and what its creator's directory entry says. The members
    # around them are the shape this compares. It assumes the real install
    # starts empty, as the whole harness does — a Kibana left dirty by an
    # earlier run reports its leftovers here rather than a defect.
    ignore_paths:
      - $.cases[*].status
      - $.cases[*].closed_at
      - $.cases[*].closed_by
      - $.cases[*].updated_at
      - $.cases[*].updated_by
      - $.cases[*].created_by
      - $.count_open_cases
      - $.count_in_progress_cases
      - $.count_closed_cases
      - $.total
    request:
      method: GET
      path: /api/cases/_find
      query: {"sortField": "title", "sortOrder": "asc"}
      auth: basic

  - id: kbn-cases-delete-no-ids
    endpoint: kibana
    why: >
      Deleting with no ids at all. mockdr read them from the body and
      answered 204 either way, so a client sending the documented form
      deleted nothing here and everything there.
    request:
      method: DELETE
      path: /api/cases
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-cases-delete-unknown-id
    endpoint: kibana
    why: A saved object that is not there is a 404 naming it, not a silent success.
    request:
      method: DELETE
      path: /api/cases
      query: {ids: '["no-such-case"]'}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-cases-delete-ids-not-an-array
    endpoint: kibana
    why: The ids parameter names the JSON type it got, the way JavaScript names it.
    request:
      method: DELETE
      path: /api/cases
      query: {ids: '"x"'}
      headers: {kbn-xsrf: "true"}
      auth: basic

  # ── Kibana: the rules API validates in a different dialect (2.3.0) ─────
  #
  # Same shape of endpoint, different validator: zod rather than io-ts, its
  # own wording, no page cap, unknown keys accepted — and one rule the
  # schema cannot express, which arrives in an envelope of its own.

  - id: kbn-rules-find-per-page-negative
    endpoint: kibana
    why: >
      The rules API validates with zod, not the io-ts the Cases API uses, so it words the same complaint differently.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"per_page": "-1"}
      auth: basic

  - id: kbn-rules-find-page-below-one
    endpoint: kibana
    why: >
      Its lower bound for a page is 1, and it says so in zod's wording.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"page": "0"}
      auth: basic

  - id: kbn-rules-find-page-not-a-number
    endpoint: kibana
    why: >
      zod calls that nan.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"page": "bad"}
      auth: basic

  - id: kbn-rules-find-sort-field-unknown
    endpoint: kibana
    why: >
      The enum error lists every spelling this endpoint sorts by.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"sort_field": "nope"}
      auth: basic

  - id: kbn-rules-find-sort-order-unknown
    endpoint: kibana
    why: >
      mockdr accepted this and sorted the other way round without saying so.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"sort_order": "sideways"}
      auth: basic

  - id: kbn-rules-find-sort-field-alone
    endpoint: kibana
    why: >
      A sort_field without its sort_order: a pairing Kibana refuses, in an envelope of its own.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"sort_field": "name"}
      auth: basic

  - id: kbn-rules-find-sort-order-alone
    endpoint: kibana
    why: >
      And the other half of the same pair.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"sort_order": "asc"}
      auth: basic

  - id: kbn-rules-find-several-problems
    endpoint: kibana
    why: >
      Joined with commas, in the schema's field order.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"page": "0", "per_page": "-1"}
      auth: basic

  - id: kbn-rules-find-sort-pair-whole
    endpoint: kibana
    why: >
      A whole pair runs. Compared as a shape: the two installs hold different rules.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"sort_field": "name", "sort_order": "asc"}
      auth: basic
    ignore_paths:
      - $.data
      - $.total
      - $.page
      - $.perPage

  - id: kbn-rules-find-unknown-key-accepted
    endpoint: kibana
    why: >
      Unlike the Cases API, this one takes a key it does not know.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"nosuchparam": "1"}
      auth: basic
    ignore_paths:
      - $.data
      - $.total
      - $.page
      - $.perPage

  - id: kbn-rules-find-per-page-uncapped
    endpoint: kibana
    why: >
      And has no page cap.
    request:
      method: GET
      path: /api/detection_engine/rules/_find
      query: {"per_page": "101"}
      auth: basic
    ignore_paths:
      - $.data
      - $.total
      - $.page
      - $.perPage

  # ── Kibana: what a case may be created with (2.3.0) ────────────────────
  #
  # mockdr checked which members were present and nothing else, so a case
  # with a severity outside the enum was created and nobody learned of it.

  - id: kbn-case-create-bad-severity
    endpoint: kibana
    why: >
      A severity outside the enum. mockdr created the case and said nothing.
    request:
      method: POST
      path: /api/cases
      json: {"title": "probe", "description": "d", "tags": [], "connector": {"id": "none", "name": "none", "type": ".none", "fields": null}, "settings": {"syncAlerts": false}, "owner": "securitySolution", "severity": "nonsense"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-case-create-status-in-body
    endpoint: kibana
    why: >
      A case is created open; asking for another state is an unknown key, not a state to honour.
    request:
      method: POST
      path: /api/cases
      json: {"title": "probe", "description": "d", "tags": [], "connector": {"id": "none", "name": "none", "type": ".none", "fields": null}, "settings": {"syncAlerts": false}, "owner": "securitySolution", "status": "open"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-case-create-unknown-key
    endpoint: kibana
    why: >
      A member the codec does not have.
    request:
      method: POST
      path: /api/cases
      json: {"title": "probe", "description": "d", "tags": [], "connector": {"id": "none", "name": "none", "type": ".none", "fields": null}, "settings": {"syncAlerts": false}, "owner": "securitySolution", "nosuchfield": "x"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-case-create-title-not-a-string
    endpoint: kibana
    why: >
      A member of the wrong type.
    request:
      method: POST
      path: /api/cases
      json: {"title": 5, "description": "d", "tags": [], "connector": {"id": "none", "name": "none", "type": ".none", "fields": null}, "settings": {"syncAlerts": false}, "owner": "securitySolution"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-case-create-tags-not-a-list
    endpoint: kibana
    why: >
      And another.
    request:
      method: POST
      path: /api/cases
      json: {"title": "probe", "description": "d", "tags": "a", "connector": {"id": "none", "name": "none", "type": ".none", "fields": null}, "settings": {"syncAlerts": false}, "owner": "securitySolution"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-case-create-several-problems
    endpoint: kibana
    why: >
      Reported together, in the codec's own order.
    request:
      method: POST
      path: /api/cases
      json: {"title": 5, "description": "d", "tags": "a", "connector": {"id": "none", "name": "none", "type": ".none", "fields": null}, "settings": {"syncAlerts": false}, "owner": "securitySolution", "severity": "x"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-case-create-unknown-owner
    endpoint: kibana
    why: >
      An owner outside the plugins that own cases: a 403, where every other failure here is a 400.
    request:
      method: POST
      path: /api/cases
      json: {"title": "probe", "description": "d", "tags": [], "connector": {"id": "none", "name": "none", "type": ".none", "fields": null}, "settings": {"syncAlerts": false}, "owner": "nosuchowner"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-case-create-empty-body
    endpoint: kibana
    why: >
      Every required member missing at once.
    request:
      method: POST
      path: /api/cases
      json: {}
      headers: {kbn-xsrf: "true"}
      auth: basic

  # ── Kibana: exception lists, in a dialect of their own (2.3.0) ─────────
  #
  # io-ts again, but every message carries the `[request query]` or
  # `[request body]` prefix the Cases API leaves off — and paging starts
  # at 1 rather than 0.

  - id: kbn-exception-find-page-zero
    endpoint: kibana
    why: >
      Paging starts at 1 here, and a value below it is a value error rather than an empty page.
    request:
      method: GET
      path: /api/exception_lists/_find
      query: {"page": "0"}
      auth: basic

  - id: kbn-exception-find-per-page-zero
    endpoint: kibana
    why: >
      So is a per_page of 0, which the Cases API takes.
    request:
      method: GET
      path: /api/exception_lists/_find
      query: {"per_page": "0"}
      auth: basic

  - id: kbn-exception-find-per-page-not-a-number
    endpoint: kibana
    why: >
      A page size that is not a number.
    request:
      method: GET
      path: /api/exception_lists/_find
      query: {"per_page": "abc"}
      auth: basic

  - id: kbn-exception-find-namespace-unknown
    endpoint: kibana
    why: >
      A namespace Kibana does not have; mockdr answered 200.
    request:
      method: GET
      path: /api/exception_lists/_find
      query: {"namespace_type": "nonsense"}
      auth: basic

  - id: kbn-exception-find-sort-field-unknown
    endpoint: kibana
    why: >
      A field the saved object is not indexed on, refused by the search with a message of its own.
    request:
      method: GET
      path: /api/exception_lists/_find
      query: {"sort_field": "nope"}
      auth: basic

  - id: kbn-exception-find-sort-order-unknown
    endpoint: kibana
    why: >
      A direction that is neither asc nor desc.
    request:
      method: GET
      path: /api/exception_lists/_find
      query: {"sort_order": "bad"}
      auth: basic

  - id: kbn-exception-find-unknown-key
    endpoint: kibana
    why: >
      A query key the endpoint does not have.
    request:
      method: GET
      path: /api/exception_lists/_find
      query: {"nosuchparam": "1"}
      auth: basic

  - id: kbn-exception-find-several-problems
    endpoint: kibana
    why: >
      Reported together, in the codec's order, behind the prefix this endpoint uses.
    request:
      method: GET
      path: /api/exception_lists/_find
      query: {"page": "0", "per_page": "-1", "namespace_type": "x"}
      auth: basic

  - id: kbn-exception-find-per-page-uncapped
    endpoint: kibana
    why: >
      There is no page cap here, where the Cases API refuses anything above
      100. What the two installs happen to hold is not the point.
    ignore_paths:
      - $.data
      - $.total
    request:
      method: GET
      path: /api/exception_lists/_find
      query: {"per_page": "101"}
      auth: basic

  - id: kbn-exception-create-empty
    endpoint: kibana
    why: >
      Every required member missing at once.
    request:
      method: POST
      path: /api/exception_lists
      json: {}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-exception-create-bad-type
    endpoint: kibana
    why: >
      A type outside the enum used to create a list here.
    request:
      method: POST
      path: /api/exception_lists
      json: {"name": "n", "description": "d", "list_id": "probe-bad", "type": "nonsense"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-exception-create-unknown-key
    endpoint: kibana
    why: >
      A member the codec does not have.
    request:
      method: POST
      path: /api/exception_lists
      json: {"name": "n", "description": "d", "list_id": "probe-key", "type": "detection", "nosuch": 1}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-exception-create-name-not-a-string
    endpoint: kibana
    why: >
      A member of the wrong type.
    request:
      method: POST
      path: /api/exception_lists
      json: {"name": 5, "description": "d", "list_id": "probe-name", "type": "detection"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-exception-get-no-params
    endpoint: kibana
    why: Neither id nor list_id given.
    request:
      method: GET
      path: /api/exception_lists
      auth: basic

  - id: kbn-exception-get-missing
    endpoint: kibana
    why: An id that names no list; mockdr worded the 404 its own way.
    request:
      method: GET
      path: /api/exception_lists
      query: {id: "no-such-list"}
      auth: basic

  # ── Kibana: the Endpoint routes, in a fourth dialect (2.3.0) ───────────
  #
  # @kbn/config-schema: it names the member in the bracket, stops at the
  # first failure, refuses a key it has no definition for, and counts pages
  # from 0. Only the validation is compared — the response actions
  # themselves need an Enterprise licence, and the 403 a Basic install
  # answers with is its licence, not the API's contract.

  - id: kbn-endpoint-metadata-page-negative
    endpoint: kibana
    why: >
      The page counts from 0 here, and a value below it is refused in a fourth dialect again: @kbn/config-schema, which names the member in the bracket.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"page": "-1"}
      auth: basic

  - id: kbn-endpoint-metadata-page-size-zero
    endpoint: kibana
    why: >
      The page size has both bounds.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"pageSize": "0"}
      auth: basic

  - id: kbn-endpoint-metadata-page-size-too-large
    endpoint: kibana
    why: >
      And the upper one.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"pageSize": "10001"}
      auth: basic

  - id: kbn-endpoint-metadata-page-size-not-a-number
    endpoint: kibana
    why: >
      A number that is not one names the type it got.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"pageSize": "abc"}
      auth: basic

  - id: kbn-endpoint-metadata-host-statuses-scalar
    endpoint: kibana
    why: >
      An array member given a scalar.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"hostStatuses": "healthy"}
      auth: basic

  - id: kbn-endpoint-metadata-sort-field-unknown
    endpoint: kibana
    why: >
      A union lists every value it would equal, one line each.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"sortField": "x"}
      auth: basic

  - id: kbn-endpoint-metadata-sort-direction-unknown
    endpoint: kibana
    why: >
      The same, with two.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"sortDirection": "x"}
      auth: basic

  - id: kbn-endpoint-metadata-unknown-key
    endpoint: kibana
    why: >
      A key the schema has no definition for; mockdr took four filters Kibana does not declare.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"nosuch": "1"}
      auth: basic

  - id: kbn-endpoint-metadata-first-failure-only
    endpoint: kibana
    why: >
      config-schema stops at the first failure rather than joining them, as the io-ts endpoints do.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"page": "-1", "pageSize": "0"}
      auth: basic

  - id: kbn-endpoint-isolate-no-ids
    endpoint: kibana
    why: >
      A response action needs at least one endpoint; mockdr reported this as a 404 about an endpoint rather than a 400 about the request.
    request:
      method: POST
      path: /api/endpoint/action/isolate
      json: {}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-endpoint-isolate-empty-ids
    endpoint: kibana
    why: >
      An array that is there but empty.
    request:
      method: POST
      path: /api/endpoint/action/isolate
      json: {"endpoint_ids": []}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-endpoint-isolate-ids-not-an-array
    endpoint: kibana
    why: >
      And one that is not an array at all.
    request:
      method: POST
      path: /api/endpoint/action/isolate
      json: {"endpoint_ids": "x"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-endpoint-isolate-unknown-key
    endpoint: kibana
    why: >
      A body key the schema has no definition for.
    request:
      method: POST
      path: /api/endpoint/action/isolate
      json: {"endpoint_ids": ["a"], "nosuch": 1}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-endpoint-isolate-comment-not-a-string
    endpoint: kibana
    why: >
      A member of the wrong type.
    request:
      method: POST
      path: /api/endpoint/action/isolate
      json: {"endpoint_ids": ["a"], "comment": 5}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-endpoint-isolate-agent-type-unknown
    endpoint: kibana
    why: >
      A union again, in the body this time.
    request:
      method: POST
      path: /api/endpoint/action/isolate
      json: {"endpoint_ids": ["a"], "agent_type": "x"}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-endpoint-action-status-no-ids
    endpoint: kibana
    why: >
      agent_ids is required; mockdr answered with an empty list, which reads
      as nothing pending.
    request:
      method: GET
      path: /api/endpoint/action_status
      auth: basic

  # ── The query clauses a SIEM client sends (2.3.1) ───────────────────────
  #
  # Every one of these was "unknown query" in mockdr, so a detection rule or
  # a Kibana search bar using one got a 400 here and hits from the cluster.
  # Each is sorted by `name` and asks for that field alone, so the rows are
  # comparable without depending on the scoring order Lucene returns them in.
  #
  # The seed carries a `message` text field and a `tags` keyword array for
  # exactly these: a term-level query reads a keyword whole and a text field
  # token by token, and that difference is what the pairs below pin.

  - id: es-prefix-keyword
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A keyword prefix compares the whole value.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"prefix": {"host": "srv-"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-prefix-text
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A text prefix compares a token, so `log` finds `login`.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"prefix": {"message": "log"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-regexp-anchored
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Lucene anchors a regexp: `srv` alone matches nothing.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"regexp": {"host": "srv"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-regexp-keyword
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Anchored, it matches the whole value.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"regexp": {"host": "srv-[0-9]"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-regexp-text
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      And on a text field it matches a token.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"regexp": {"message": "login"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-wildcard-case
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      wildcard is case-sensitive on a keyword.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"wildcard": {"host": "SRV-*"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-wildcard-case-insensitive
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Unless the clause asks for the other behaviour.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"wildcard": {"host": {"value": "SRV-*", "case_insensitive": true}}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-fuzzy-auto
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      AUTO allows no edits below three characters.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"fuzzy": {"host": {"value": "srx"}}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-fuzzy-one-edit
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      One edit away from the value matches.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"fuzzy": {"host": {"value": "srv-9", "fuzziness": 1}}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-ids
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `ids` selects by _id, which the mock could not read at all.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"ids": {"values": ["a", "c"]}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-multi-match
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      One query over several fields.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"multi_match": {"query": "login", "fields": ["message", "host"]}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-multi-match-phrase
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The phrase form needs the words in order.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"multi_match": {"query": "failed login", "fields": ["message"], "type": "phrase"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-simple-query-string
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      `|` is or, `-` excludes.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"simple_query_string": {"query": "login | malware", "fields": ["message"]}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-simple-query-string-exclude
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The exclusion on its own.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"simple_query_string": {"query": "login -alice", "fields": ["message"]}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-match-phrase-prefix
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A phrase whose last word is a prefix.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"match_phrase_prefix": {"message": "failed log"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-match-bool-prefix
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      And the bool form, which takes the last word as one.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"match_bool_prefix": {"message": "log"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-minimum-should-match
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      How many of the terms have to match, which the mock ignored.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"match": {"message": {"query": "login failed malware", "minimum_should_match": "70%"}}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-constant-score
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The wrapper that only fixes the score.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"constant_score": {"filter": {"term": {"host": "srv-1"}}}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-dis-max
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The wrapper that matches any of its queries.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"dis_max": {"queries": [{"term": {"host": "srv-1"}}, {"term": {"host": "srv-2"}}]}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-terms-set
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      terms_set counts how many of the terms a document holds.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"terms_set": {"tags": {"terms": ["auth", "linux"], "minimum_should_match_script": {"source": "2"}}}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-exists-empty-array
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A field holding an empty array does not exist.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"query": {"exists": {"field": "tags"}}, "size": 20, "sort": [{"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-agg-missing
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The `missing` aggregation: the documents without the field.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"m": {"missing": {"field": "@timestamp"}, "aggs": {"s": {"sum": {"field": "sev"}}}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-agg-top-hits
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      top_hits carries the ids the documents were indexed with.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"t": {"top_hits": {"size": 2, "_source": ["name"], "sort": [{"sev": "desc"}]}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  # ── Mappings and field capabilities (2.3.1) ─────────────────────────────
  #
  # mockdr took a client's `mappings` on PUT /{index} and threw them away, so
  # `GET /{index}` said the index had no fields; `_field_caps` — what every
  # Kibana data view asks for before it can draw anything — was not served at
  # all. The seed index declares five fields and its documents introduce
  # none, so both engines should report exactly the declared mapping.

  - id: es-mapping-declared
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The mapping the index was created with comes back.
    request:
      method: GET
      path: /${seed_index}/_mapping
      auth: basic

  - id: es-mapping-in-get-index
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      GET /{index} reports the mapping too.
    request:
      method: GET
      path: /${seed_index}
      auth: basic

  - id: es-mapping-one-field
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      One field, in the shape _mapping/field answers with.
    request:
      method: GET
      path: /${seed_index}/_mapping/field/host
      auth: basic

  - id: es-mapping-unknown-field
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A field the index does not have reports nothing.
    request:
      method: GET
      path: /${seed_index}/_mapping/field/nosuchfield
      auth: basic

  - id: es-field-caps
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      What each field is, and whether it can be aggregated.
    request:
      method: GET
      path: /${seed_index}/_field_caps
      query: {fields: 'host,message,sev,tags'}
      auth: basic

  - id: es-field-caps-body
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The fields can be named in the body instead.
    request:
      method: POST
      path: /${seed_index}/_field_caps
      content: '{"fields": ["host"]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-field-caps-missing-index
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      And a missing index is a 404, not an empty answer.
    request:
      method: GET
      path: /no-such-index-xyz/_field_caps
      query: {fields: '*'}
      auth: basic

  - id: es-agg-terms-on-text
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A terms aggregation over a text field: fielddata is off, so a cluster refuses it where the mock grouped by the whole sentence.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"a": {"terms": {"field": "message"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-agg-terms-on-keyword-subfield
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The keyword subfield it tells you to use instead.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 0, "aggs": {"a": {"terms": {"field": "message.keyword"}}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-sort-on-text
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Sorting on a text field is refused for the same reason aggregating on one is.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 3, "sort": [{"message": "asc"}]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-sort-on-unmapped
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      And a field the mapping does not have is refused by the shard that would sort it.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 3, "sort": [{"nosuchfield": "asc"}]}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-sort-unmapped-type
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Unless the client says what type to assume.
    request:
      method: POST
      path: /${seed_index}/_search
      content: '{"size": 3, "sort": [{"nosuchfield": {"order": "asc", "unmapped_type": "long"}}, {"name": "asc"}], "_source": ["name"]}'
      headers: {Content-Type: application/json}
      auth: basic

  # ── Aliases, multi-search and the rest of the surface (2.3.1) ───────────
  #
  # An endpoint sweep against the real cluster found these missing: every
  # alias call was a 404, `_msearch` — what Kibana sends for almost every
  # panel — fell through to the 404 handler, and a scrolled search came back
  # without a scroll id, so a fetch stopped after its first page with nothing
  # to say why. These read the seeded index, so they sit before the writes.

  - id: es-msearch
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Several searches in one request, each with its own status.
    request:
      method: POST
      path: /${seed_index}/_msearch
      content: "{\"index\": \"conformance-seeded\"}\n{\"query\": {\"match_all\": {}}, \"size\": 0}\n{\"index\": \"conformance-seeded\"}\n{\"query\": {\"term\": {\"host\": \"srv-1\"}}, \"size\": 0}\n"
      headers: {Content-Type: application/x-ndjson}
      auth: basic

  - id: es-msearch-one-fails
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A body that will not parse fails the whole request, where a shard failure belongs to its own search.
    request:
      method: POST
      path: /_msearch
      content: "{\"index\": \"conformance-seeded\"}\n{\"query\": {\"nosuchquery\": {}}}\n{\"index\": \"conformance-seeded\"}\n{\"query\": {\"match_all\": {}}, \"size\": 0}\n"
      headers: {Content-Type: application/x-ndjson}
      auth: basic

  - id: es-analyze
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The tokens a standard analyser makes.
    request:
      method: POST
      path: /${seed_index}/_analyze
      content: '{"text": "srv-1, 10.0.0.1 FAILED"}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-analyze-keyword-field
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A keyword field keeps the whole value.
    request:
      method: POST
      path: /${seed_index}/_analyze
      content: '{"text": "a B", "field": "host"}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-analyze-no-text
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      And text is required.
    request:
      method: POST
      path: /${seed_index}/_analyze
      content: '{}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-validate-query
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Whether a query would run.
    request:
      method: POST
      path: /${seed_index}/_validate/query
      content: '{"query": {"term": {"host": "srv-1"}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-validate-query-bad
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      One that would not, which answers with nothing else.
    request:
      method: POST
      path: /${seed_index}/_validate/query
      content: '{"query": {"nosuchquery": {}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-terms-enum
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The values of a field, for an autocomplete.
    request:
      method: POST
      path: /${seed_index}/_terms_enum
      content: '{"field": "host"}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-terms-enum-prefix
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Narrowed by a prefix.
    request:
      method: POST
      path: /${seed_index}/_terms_enum
      content: '{"field": "host", "string": "srv-1"}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-terms-enum-text
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A text field has nothing to enumerate, and that is not an error.
    request:
      method: POST
      path: /${seed_index}/_terms_enum
      content: '{"field": "message"}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-settings
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The settings half of an index.
    request:
      method: GET
      path: /${seed_index}/_settings
      auth: basic

  # ── The rest of the platform surface (2.3.1) ────────────────────────────
  #
  # What a client calls *around* the work: it lists the saved objects and
  # data views to find out what it can search, reads Fleet's policies and
  # readiness, and — where it only reaches Kibana — talks to Elasticsearch
  # through the console proxy. `_cat` is here too: every one of those
  # endpoints answers a *table*, and mockdr answered json regardless.

  - id: kbn-saved-objects-find
    endpoint: kibana
    why: >
      Saved objects of a type.
    request:
      method: GET
      path: /api/saved_objects/_find
      query: {type: 'index-pattern'}
      auth: basic

  - id: kbn-saved-objects-no-type
    endpoint: kibana
    why: >
      The type is required, in the config schema's words.
    request:
      method: GET
      path: /api/saved_objects/_find
      auth: basic

  - id: kbn-data-views
    endpoint: kibana
    why: >
      The data views a space defines.
    request:
      method: GET
      path: /api/data_views
      auth: basic

  - id: kbn-fleet-agent-policies
    endpoint: kibana
    why: >
      The policies agents are enrolled into.
    request:
      method: GET
      path: /api/fleet/agent_policies
      auth: basic

  - id: kbn-timelines
    endpoint: kibana
    why: >
      The Security Solution timelines a space holds.
    request:
      method: GET
      path: /api/timelines
      auth: basic

  - id: kbn-timeline-missing
    endpoint: kibana
    why: >
      A timeline that is not there is an empty object.
    request:
      method: GET
      path: /api/timeline
      query: {id: 'no-such-timeline'}
      auth: basic

  - id: kbn-notes
    endpoint: kibana
    why: >
      The notes attached to timelines and events.
    request:
      method: GET
      path: /api/note
      auth: basic

  - id: kbn-cases-configure
    endpoint: kibana
    why: >
      The case connectors a space configures.
    request:
      method: GET
      path: /api/cases/configure
      auth: basic

  - id: kbn-osquery-packs
    endpoint: kibana
    why: >
      The Osquery packs it defines.
    request:
      method: GET
      path: /api/osquery/packs
      auth: basic

  - id: kbn-console-proxy-no-path
    endpoint: kibana
    why: >
      The console proxy needs a path, and says so the way its schema does.
    request:
      method: POST
      path: /api/console/proxy
      query: {method: 'GET'}
      auth: basic

  - id: es-cat-indices-text
    endpoint: search
    why: >
      `_cat` answers a table, which is what it is for.
    request:
      method: GET
      path: /_cat/indices
      query: {v: 'true'}
      auth: basic

  - id: es-cat-health-text
    endpoint: search
    why: >
      The same for the health line.
    request:
      method: GET
      path: /_cat/health
      auth: basic

  - id: kbn-endpoint-metadata-listing
    endpoint: kibana
    why: >
      The successful listing, which no probe covered: the envelope echoes the page it was asked for and the sort it applied.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"page": "1", "pageSize": "2"}
      auth: basic

  - id: kbn-endpoint-metadata-sorted
    endpoint: kibana
    why: >
      And the sort it was given, echoed back.
    request:
      method: GET
      path: /api/endpoint/metadata
      query: {"sortField": "metadata.host.hostname", "sortDirection": "asc"}
      auth: basic

  # ── Writes (2.3.1) ──────────────────────────────────────────────────────
  #
  # Last in the file on purpose: these change the seeded documents, so every
  # probe that reads them runs first. Both engines start from the same six
  # documents and get the same requests in the same order, so the answers
  # stay comparable.
  #
  # `_update`, `_update_by_query`, `_delete_by_query`, `_source` and the
  # maintenance calls were not served at all — a client closing a signal or
  # refreshing after a write got a 404 here and a write from the cluster.

  - id: es-update-doc
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A partial document is merged into the one that is there.
    request:
      method: POST
      path: /${seed_index}/_update/a
      query: {refresh: 'true'}
      content: '{"doc": {"sev": 99}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-update-source-after
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      And the document reads back changed.
    request:
      method: GET
      path: /${seed_index}/_source/a
      auth: basic

  - id: es-update-noop
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Writing the same value again is a noop, and no shard works.
    request:
      method: POST
      path: /${seed_index}/_update/a
      query: {refresh: 'true'}
      content: '{"doc": {"sev": 99}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-update-missing
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A document that is not there is a 404 that names it.
    request:
      method: POST
      path: /${seed_index}/_update/zz
      content: '{"doc": {"sev": 1}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-update-upsert
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      doc_as_upsert creates it instead.
    request:
      method: POST
      path: /${seed_index}/_update/upserted
      query: {refresh: 'true'}
      content: '{"doc": {"sev": 1}, "doc_as_upsert": true}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-update-script
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The assignment a SIEM writes.
    request:
      method: POST
      path: /${seed_index}/_update/b
      query: {refresh: 'true'}
      content: '{"script": {"source": "ctx._source.name = ''renamed''"}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-update-script-params
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      With a parameter, and a compound assignment.
    request:
      method: POST
      path: /${seed_index}/_update/b
      query: {refresh: 'true'}
      content: '{"script": {"source": "ctx._source.sev = params.v", "params": {"v": 42}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-update-by-query
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Every document a query matches.
    request:
      method: POST
      path: /${seed_index}/_update_by_query
      query: {refresh: 'true'}
      content: '{"query": {"term": {"host": "srv-2"}}, "script": {"source": "ctx._source.name = ''grouped''"}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-update-by-query-no-match
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      And one that matches nothing.
    request:
      method: POST
      path: /${seed_index}/_update_by_query
      content: '{"query": {"term": {"host": "nope"}}, "script": {"source": "ctx._source.name = ''x''"}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-source
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The _source alone, which is what most clients want.
    request:
      method: GET
      path: /${seed_index}/_source/c
      auth: basic

  - id: es-source-missing
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      A document that is not there.
    request:
      method: GET
      path: /${seed_index}/_source/zz
      auth: basic

  - id: es-refresh
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The call an ingest script makes after writing.
    request:
      method: POST
      path: /${seed_index}/_refresh
      auth: basic

  - id: es-delete-by-query
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      Deleting everything a query matches.
    request:
      method: POST
      path: /${seed_index}/_delete_by_query
      query: {refresh: 'true'}
      content: '{"query": {"term": {"host": "srv-3"}}}'
      headers: {Content-Type: application/json}
      auth: basic

  - id: es-count-after-delete
    endpoint: search
    needs_seed: true
    compare: values
    why: >
      The count that proves it happened.
    request:
      method: GET
      path: /${seed_index}/_count
      auth: basic

  # ── Kibana: alerting, actions and identity (2.3.1) ──────────────────────
  #
  # An endpoint sweep found every one of these answering 404 here and 200 on
  # a running Kibana. The rule-type catalogue, the licence and the task
  # manager's health are captured from a running instance rather than typed
  # out, because a client reads deep into each — and the task manager's own
  # numbers move between runs, which is why only its shape is compared.

  - id: kbn-alerting-health
    endpoint: kibana
    why: >
      Whether the framework can run rules at all.
    request:
      method: GET
      path: /api/alerting/_health
      auth: basic

  - id: kbn-alerting-rule-types
    endpoint: kibana
    why: >
      The kinds of rule a deployment can run, read deep into.
    request:
      method: GET
      path: /api/alerting/rule_types
      auth: basic

  - id: kbn-alerting-rules-find
    endpoint: kibana
    why: >
      The rules it holds.
    request:
      method: GET
      path: /api/alerting/rules/_find
      query: {per_page: '1'}
      auth: basic

  - id: kbn-actions-connectors
    endpoint: kibana
    why: >
      The connectors a rule acts through.
    request:
      method: GET
      path: /api/actions/connectors
      auth: basic

  - id: kbn-actions-connector-types
    endpoint: kibana
    why: >
      And their kinds, each carrying the licence it needs.
    request:
      method: GET
      path: /api/actions/connector_types
      auth: basic

  - id: kbn-security-me
    endpoint: kibana
    why: >
      Who Kibana thinks the caller is.
    request:
      method: GET
      path: /internal/security/me
      auth: basic

  - id: kbn-licensing-info
    endpoint: kibana
    why: >
      The licence, and which features it allows.
    request:
      method: GET
      path: /api/licensing/info
      auth: basic

  - id: kbn-lists-find
    endpoint: kibana
    why: >
      The value lists an exception can point at.
    request:
      method: GET
      path: /api/lists/_find
      auth: basic

  - id: kbn-exception-items-missing-list
    endpoint: kibana
    why: >
      A find against a list that is not there: a 404 in the Security Solution's envelope, where the mock said the list exists and holds nothing.
    request:
      method: GET
      path: /api/exception_lists/items/_find
      query: {list_id: 'no-such-list', namespace_type: 'single'}
      auth: basic

  - id: kbn-case-comment-add
    endpoint: kibana
    needs_seed: true
    why: >
      A comment write is answered with the *case*, comments and all — not
      with the comment. mockdr answered with the comment, so a client that
      read the answer as a case found none of its fields.
    request:
      method: POST
      path: /api/cases/${seed_case}/comments
      json: {type: user, comment: conformance-probe-second, owner: securitySolution}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-case-comment-delete
    endpoint: kibana
    needs_seed: true
    why: >
      And a comment is deleted with 204 and no body at all, not with a 200
      carrying `null`.
    request:
      method: DELETE
      path: /api/cases/${seed_case}/comments/${seed_comment}
      headers: {kbn-xsrf: "true"}
      auth: basic

  - id: kbn-case-comment-delete-again
    endpoint: kibana
    needs_seed: true
    why: >
      The same comment a second time is a 404 that names it.
    request:
      method: DELETE
      path: /api/cases/${seed_case}/comments/${seed_comment}
      headers: {kbn-xsrf: "true"}
      auth: basic
